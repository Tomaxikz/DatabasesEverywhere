name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  global_lint:
    name: Global lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint GitHub Actions syntax
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          version: 1.7.12
          cache: false
          pyflakes: false

      - name: Lint shell scripts
        run: shellcheck .github/ci/check.sh .github/ci/check-source-size.sh .github/ci/podman-smoke.sh .github/ci/build-release-target.sh .github/ci/mysql-driver-matrix.sh tests/real_drivers/mysql/run.sh .githooks/pre-push

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: Install workflow security linter
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2.86.3
        with:
          tool: zizmor@1.28.0
          fallback: none

      - name: Audit GitHub Actions security
        run: zizmor --offline --strict-collection --min-severity=medium .

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: dbev-debug
          cache-on-failure: false

      - name: Lint Rust workspace
        run: bash .github/ci/check.sh lint

  security_audit:
    name: Dependency security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: global_lint
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.95.0

      - name: Install cargo-audit
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2.86.3
        with:
          tool: cargo-audit@0.22.2
          fallback: none

      - name: Audit dependencies
        run: bash .github/ci/check.sh audit

  tests:
    name: Linux tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: global_lint
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.95.0

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: dbev-debug
          cache-on-failure: false

      - name: Check and test Linux workspace
        run: bash .github/ci/check.sh test

  mysql_driver_matrix:
    name: Real MySQL/MariaDB clients and versions
    needs: global_lint
    permissions:
      contents: read
    uses: ./.github/workflows/mysql-driver-matrix.yml

  podman_smoke:
    name: Rootless Podman compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: global_lint
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.95.0

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: dbev-debug
          cache-on-failure: false

      - name: Prepare the hosted rootless Podman runtime
        run: |
          for command in podman newuidmap newgidmap; do
            command -v "$command" >/dev/null || {
              echo "GitHub runner is missing required rootless runtime tool: $command" >&2
              exit 1
            }
          done
          runtime_dir="/run/user/$(id -u)"
          sudo install -d -m 0700 -o "$(id -u)" -g "$(id -g)" "$runtime_dir"
          account="$(id -un)"
          if ! grep -q "^${account}:" /etc/subuid; then
            sudo usermod --add-subuids 100000-165535 "$account"
          fi
          if ! grep -q "^${account}:" /etc/subgid; then
            sudo usermod --add-subgids 100000-165535 "$account"
          fi

      - name: Exercise the rootless Podman API
        run: bash .github/ci/podman-smoke.sh

  documentation:
    name: Rust documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: global_lint
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.95.0

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: dbev-debug
          cache-on-failure: false

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

  codeql:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: global_lint
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - rust
          - actions
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.95.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: /language:${{ matrix.language }}

  release_build:
    name: Linux release binaries
    needs: global_lint
    permissions:
      contents: read
    uses: ./.github/workflows/build-binaries.yml

  ci_gate:
    name: CI gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: always()
    needs:
      - global_lint
      - security_audit
      - tests
      - mysql_driver_matrix
      - podman_smoke
      - documentation
      - codeql
      - release_build
    steps:
      - name: Require every CI stage
        env:
          GLOBAL_LINT_RESULT: ${{ needs.global_lint.result }}
          SECURITY_AUDIT_RESULT: ${{ needs.security_audit.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          MYSQL_DRIVER_MATRIX_RESULT: ${{ needs.mysql_driver_matrix.result }}
          PODMAN_SMOKE_RESULT: ${{ needs.podman_smoke.result }}
          DOCUMENTATION_RESULT: ${{ needs.documentation.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          RELEASE_BUILD_RESULT: ${{ needs.release_build.result }}
        run: |
          failed=0
          {
            echo "## CI gate"
            echo
            echo "| Stage | Result |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          for stage in \
            "global lint=$GLOBAL_LINT_RESULT" \
            "dependency security=$SECURITY_AUDIT_RESULT" \
            "Linux tests=$TESTS_RESULT" \
            "real MySQL/MariaDB clients and versions=$MYSQL_DRIVER_MATRIX_RESULT" \
            "rootless Podman compatibility=$PODMAN_SMOKE_RESULT" \
            "Rust documentation=$DOCUMENTATION_RESULT" \
            "CodeQL=$CODEQL_RESULT" \
            "release build=$RELEASE_BUILD_RESULT"
          do
            label="${stage%%=*}"
            result="${stage##*=}"
            if [ "$result" = "success" ]; then
              printf 'PASS  %s\n' "$stage"
              printf '| %s | PASS (%s) |\n' "$label" "$result" >> "$GITHUB_STEP_SUMMARY"
            else
              printf 'FAIL  %s\n' "$stage" >&2
              printf '| %s | FAIL (%s) |\n' "$label" "$result" >> "$GITHUB_STEP_SUMMARY"
              failed=1
            fi
          done
          exit "$failed"

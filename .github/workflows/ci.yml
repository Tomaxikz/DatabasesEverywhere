name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  global_lint:
    name: Global lint
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Lint GitHub Actions syntax
        uses: raven-actions/actionlint@205b530c5d9fa8f44ae9ed59f341a0db994aa6f8 # v2.1.2
        with:
          version: 1.7.12
          cache: false
          pyflakes: false

      - name: Lint shell scripts
        run: shellcheck .github/ci/check.sh .github/ci/build-release-target.sh .githooks/pre-push

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

      - name: Install workflow security linter
        uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2.85.3
        with:
          tool: zizmor@1.28.0
          fallback: none

      - name: Audit GitHub Actions security
        run: zizmor --offline --strict-collection --min-severity=medium .

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-on-failure: false

      - name: Lint Rust workspace
        run: bash .github/ci/check.sh lint

  security_audit:
    name: Dependency security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: global_lint
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.95.0

      - name: Install cargo-audit
        uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2.85.3
        with:
          tool: cargo-audit@0.22.2
          fallback: none

      - name: Audit dependencies
        run: |
          rsa_tree="$(cargo tree --locked --edges normal -i rsa 2>/dev/null || true)"
          if [ -n "$rsa_tree" ]; then
            echo "RUSTSEC-2023-0071 is ignored only while rsa is absent from the built graph" >&2
            printf '%s\n' "$rsa_tree" >&2
            exit 1
          fi
          cargo audit --no-yanked -D warnings

  tests:
    name: Linux tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: global_lint
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.95.0

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: tests
          cache-on-failure: false

      - name: Check and test Linux workspace
        run: bash .github/ci/check.sh test

  documentation:
    name: Rust documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: global_lint
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.95.0

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: documentation
          cache-on-failure: false

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

  codeql:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: global_lint
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - rust
          - actions
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install Rust
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.95.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          category: /language:${{ matrix.language }}

  release_build:
    name: Release build (${{ matrix.asset_arch }})
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    needs:
      - security_audit
      - tests
      - documentation
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset_arch: x86_64
            rust_target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
          - asset_arch: arm64
            rust_target: aarch64-unknown-linux-gnu
            rust_targets: aarch64-unknown-linux-gnu,aarch64-unknown-linux-musl
          - asset_arch: riscv64
            rust_target: riscv64gc-unknown-linux-gnu
            rust_targets: riscv64gc-unknown-linux-gnu,riscv64gc-unknown-linux-musl
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.rust_targets }}

      - name: Install cross compiler
        if: matrix.asset_arch != 'x86_64'
        env:
          ASSET_ARCH: ${{ matrix.asset_arch }}
        run: |
          set -euo pipefail
          case "$ASSET_ARCH" in
            arm64)
              packages=(gcc-aarch64-linux-gnu g++-aarch64-linux-gnu)
              ;;
            riscv64)
              packages=(gcc-riscv64-linux-gnu g++-riscv64-linux-gnu)
              ;;
            *)
              echo "unsupported cross-compiler architecture: $ASSET_ARCH" >&2
              exit 1
              ;;
          esac
          sudo apt-get update
          sudo apt-get install --no-install-recommends "${packages[@]}"

      - name: Install Zig for the RISC-V static helper
        if: matrix.asset_arch == 'riscv64'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.14.1

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: release-${{ matrix.asset_arch }}
          cache-on-failure: false

      - name: Build optimized binary
        env:
          ASSET_ARCH: ${{ matrix.asset_arch }}
          RUST_TARGET: ${{ matrix.rust_target }}
        run: bash .github/ci/build-release-target.sh "$RUST_TARGET" "$ASSET_ARCH"

  ci_gate:
    name: CI gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: always()
    needs:
      - global_lint
      - security_audit
      - tests
      - documentation
      - codeql
      - release_build
    steps:
      - name: Require every CI stage
        env:
          GLOBAL_LINT_RESULT: ${{ needs.global_lint.result }}
          SECURITY_AUDIT_RESULT: ${{ needs.security_audit.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          DOCUMENTATION_RESULT: ${{ needs.documentation.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          RELEASE_BUILD_RESULT: ${{ needs.release_build.result }}
        run: |
          failed=0
          {
            echo "## CI gate"
            echo
            echo "| Stage | Result |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          for stage in \
            "global lint=$GLOBAL_LINT_RESULT" \
            "dependency security=$SECURITY_AUDIT_RESULT" \
            "Linux tests=$TESTS_RESULT" \
            "Rust documentation=$DOCUMENTATION_RESULT" \
            "CodeQL=$CODEQL_RESULT" \
            "release build=$RELEASE_BUILD_RESULT"
          do
            label="${stage%%=*}"
            result="${stage##*=}"
            if [ "$result" = "success" ]; then
              printf 'PASS  %s\n' "$stage"
              printf '| %s | PASS (%s) |\n' "$label" "$result" >> "$GITHUB_STEP_SUMMARY"
            else
              printf 'FAIL  %s\n' "$stage" >&2
              printf '| %s | FAIL (%s) |\n' "$label" "$result" >> "$GITHUB_STEP_SUMMARY"
              failed=1
            fi
          done
          exit "$failed"

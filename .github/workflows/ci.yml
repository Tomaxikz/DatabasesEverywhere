name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
  workflow_dispatch:
  # Weekly full run, with the slow real-engine suites.
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  global_lint:
    name: Global lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint GitHub Actions syntax
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          version: 1.7.12
          cache: false
          pyflakes: false

      - name: Lint shell scripts
        run: shellcheck .github/ci/check.sh .github/ci/check-source-size.sh .github/ci/podman-smoke.sh .github/ci/build-release-target.sh .github/ci/mysql-driver-matrix.sh .github/ci/shared-pool-isolation.sh .github/ci/project-quota-smoke.sh .github/ci/online-backup-e2e.sh tests/real_drivers/mysql/run.sh .githooks/pre-push

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: deploy/docker/Dockerfile
          failure-threshold: warning

      - name: Install workflow security linter
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: zizmor@1.28.0
          fallback: none

      - name: Audit GitHub Actions security
        run: zizmor --offline --strict-collection --min-severity=medium .

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy

      - name: Install cargo-machete
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-machete@0.9.2
          fallback: none

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: dbev-debug
          cache-on-failure: false

      - name: Lint Rust workspace
        run: bash .github/ci/check.sh lint

  security_audit:
    name: Dependency security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: global_lint
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.99.0

      - name: Install cargo-audit
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-audit@0.22.2
          fallback: none

      - name: Audit dependencies
        run: bash .github/ci/check.sh audit

  tests:
    name: Linux tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: global_lint
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.99.0
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov@0.9.1
          fallback: none

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: dbev-coverage
          cache-on-failure: false

      - name: Test Linux workspace with coverage
        id: coverage
        run: bash .github/ci/check.sh coverage

      - name: Generate informational coverage reports
        if: ${{ !cancelled() && steps.coverage.outcome != 'skipped' }}
        run: |
          mkdir -p target/coverage
          cargo llvm-cov report --lcov --output-path target/coverage/lcov.info
          cargo llvm-cov report --html --output-dir target/coverage
          cargo llvm-cov report | tee target/coverage/summary.txt
          {
            echo '## Rust coverage'
            echo
            echo 'Informational only: no minimum coverage percentage is enforced.'
            echo 'Doctests and opt-in external-service tests are not included in these percentages.'
            echo
            echo '```text'
            cat target/coverage/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports
        if: ${{ !cancelled() && steps.coverage.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-coverage
          path: target/coverage/
          if-no-files-found: error
          retention-days: 7

  mysql_driver_matrix:
    name: ${{ matrix.image }} with Connector/J ${{ matrix.connector }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: global_lint
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - protocol: mysql
            image: mysql:8.4
            connector: 8.4.0
          - protocol: mysql
            image: mysql:8.4
            connector: 9.7.0
          - protocol: mysql
            image: mysql:9.7
            connector: 9.2.0
          - protocol: mysql
            image: mysql:26.7
            connector: 26.7.0
          - protocol: mariadb
            image: mariadb:10.11
            connector: 8.4.0
          - protocol: mariadb
            image: mariadb:11.4
            connector: 9.2.0
          - protocol: mariadb
            image: mariadb:11.8
            connector: 9.7.0
          - protocol: mariadb
            image: mariadb:12.3
            connector: 26.7.0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.99.0

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: dbev-debug
          cache-on-failure: false

      - name: Select hosted Java 21 and verify client toolchains
        run: |
          if [ -z "${JAVA_HOME_21_X64:-}" ] || \
             [ ! -x "$JAVA_HOME_21_X64/bin/java" ] || \
             [ ! -x "$JAVA_HOME_21_X64/bin/javac" ]; then
            echo "GitHub runner is missing its advertised Java 21 toolchain" >&2
            exit 1
          fi
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          for command in docker mvn openssl; do
            command -v "$command" >/dev/null || {
              echo "GitHub runner is missing required tool: $command" >&2
              exit 1
            }
          done

      - name: Compile the compatibility test
        run: cargo test --locked --lib --no-run

      - name: Exercise one real database and driver combination
        env:
          DBE_MATRIX_PROTOCOL: ${{ matrix.protocol }}
          DBE_MATRIX_IMAGE: ${{ matrix.image }}
          DBE_MATRIX_CONNECTOR: ${{ matrix.connector }}
          DBE_MARIADB_CLI_IMAGE: ${{ matrix.protocol == 'mariadb' && matrix.image || 'mariadb:11.4' }}
          DBE_DRIVER_CASE_TIMEOUT: 12m
        run: |
          bash .github/ci/mysql-driver-matrix.sh \
            "$DBE_MATRIX_PROTOCOL" \
            "$DBE_MATRIX_IMAGE" \
            "$DBE_MATRIX_CONNECTOR"

  podman_smoke:
    name: Rootless Podman compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: global_lint
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.99.0

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: dbev-debug
          cache-on-failure: false

      - name: Prepare the hosted rootless Podman runtime
        run: |
          for command in podman newuidmap newgidmap; do
            command -v "$command" >/dev/null || {
              echo "GitHub runner is missing required rootless runtime tool: $command" >&2
              exit 1
            }
          done
          runtime_dir="/run/user/$(id -u)"
          sudo install -d -m 0700 -o "$(id -u)" -g "$(id -g)" "$runtime_dir"
          account="$(id -un)"
          if ! grep -q "^${account}:" /etc/subuid; then
            sudo usermod --add-subuids 100000-165535 "$account"
          fi
          if ! grep -q "^${account}:" /etc/subgid; then
            sudo usermod --add-subgids 100000-165535 "$account"
          fi

      - name: Exercise the rootless Podman API
        run: bash .github/ci/podman-smoke.sh

  documentation:
    name: Rust documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: global_lint
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.99.0

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: dbev-debug
          cache-on-failure: false

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

  codeql:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: global_lint
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - rust
          - actions
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.99.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}

  release_build:
    name: dbev-${{ matrix.asset_arch }}-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    needs: global_lint
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - asset_arch: x86_64
            rust_target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
          - asset_arch: arm64
            rust_target: aarch64-unknown-linux-gnu
            rust_targets: aarch64-unknown-linux-gnu,aarch64-unknown-linux-musl
          - asset_arch: riscv64
            rust_target: riscv64gc-unknown-linux-gnu
            rust_targets: riscv64gc-unknown-linux-gnu,riscv64gc-unknown-linux-musl
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and verify binary
        uses: ./.github/actions/build-binary
        with:
          asset-arch: ${{ matrix.asset_arch }}
          rust-target: ${{ matrix.rust_target }}
          rust-targets: ${{ matrix.rust_targets }}
          cache: "true"

  shared_pool_isolation:
    name: ${{ matrix.protocol }} tenant isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: global_lint
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        protocol:
          - postgres
          - mysql
          - mariadb
          - mongodb
          - clickhouse
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.99.0

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: dbev-debug
          cache-on-failure: false

      - name: Verify hosted Docker
        run: docker info >/dev/null

      - name: Compile the shared-pool integration tests
        run: cargo test --locked --lib --no-run

      - name: Exercise one real shared database engine
        env:
          DBE_SHARED_POOL_TEST_TIMEOUT: 12m
          DBE_SHARED_POOL_PROTOCOL: ${{ matrix.protocol }}
        run: bash .github/ci/shared-pool-isolation.sh "$DBE_SHARED_POOL_PROTOCOL"

  project_quota:
    name: XFS + ext4 + F2FS project quotas
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: global_lint
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.99.0

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: dbev-debug
          cache-on-failure: false

      - name: Install project-quota tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes e2fsprogs f2fs-tools quota xfsprogs

      - name: Verify privileged loopback support
        run: sudo -n true && test -e /dev/loop-control

      - name: Exercise native project quotas
        env:
          DBE_PROJECT_QUOTA_TEST_TIMEOUT: 6m
        run: bash .github/ci/project-quota-smoke.sh all

  project_quota_engines:
    name: ${{ matrix.protocol }} on real XFS + ext4 tenant quotas
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: global_lint
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        protocol:
          - postgres
          - mysql
          - mariadb
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.99.0

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: dbev-debug
          cache-on-failure: false

      - name: Install project-quota tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes e2fsprogs quota xfsprogs

      - name: Verify privileged loopback and Docker support
        run: sudo -n true && test -e /dev/loop-control && docker info >/dev/null

      - name: Exercise real engine writes through both hard-quota backends
        env:
          DBE_PROJECT_QUOTA_TEST_TIMEOUT: 12m
          DBE_PROJECT_QUOTA_BUILD_TIMEOUT: 15m
          DBE_PROJECT_QUOTA_ENGINE_PROTOCOL: ${{ matrix.protocol }}
        run: |
          bash .github/ci/project-quota-smoke.sh xfs "$DBE_PROJECT_QUOTA_ENGINE_PROTOCOL"
          bash .github/ci/project-quota-smoke.sh ext4 "$DBE_PROJECT_QUOTA_ENGINE_PROTOCOL"

  ci_gate:
    name: CI gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: always()
    needs:
      - global_lint
      - security_audit
      - tests
      - mysql_driver_matrix
      - podman_smoke
      - documentation
      - codeql
      - release_build
    steps:
      - name: Require every CI stage
        env:
          GLOBAL_LINT_RESULT: ${{ needs.global_lint.result }}
          SECURITY_AUDIT_RESULT: ${{ needs.security_audit.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          MYSQL_DRIVER_MATRIX_RESULT: ${{ needs.mysql_driver_matrix.result }}
          PODMAN_SMOKE_RESULT: ${{ needs.podman_smoke.result }}
          DOCUMENTATION_RESULT: ${{ needs.documentation.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          RELEASE_BUILD_RESULT: ${{ needs.release_build.result }}
        run: |
          failed=0
          {
            echo "## CI gate"
            echo
            echo "| Stage | Result |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          for stage in \
            "global lint=$GLOBAL_LINT_RESULT" \
            "dependency security=$SECURITY_AUDIT_RESULT" \
            "Linux tests=$TESTS_RESULT" \
            "real MySQL/MariaDB clients and versions=$MYSQL_DRIVER_MATRIX_RESULT" \
            "rootless Podman compatibility=$PODMAN_SMOKE_RESULT" \
            "Rust documentation=$DOCUMENTATION_RESULT" \
            "CodeQL=$CODEQL_RESULT" \
            "release build=$RELEASE_BUILD_RESULT"
          do
            label="${stage%%=*}"
            result="${stage##*=}"
            if [ "$result" = "success" ]; then
              printf 'PASS  %s\n' "$stage"
              printf '| %s | PASS (%s) |\n' "$label" "$result" >> "$GITHUB_STEP_SUMMARY"
            else
              printf 'FAIL  %s\n' "$stage" >&2
              printf '| %s | FAIL (%s) |\n' "$label" "$result" >> "$GITHUB_STEP_SUMMARY"
              failed=1
            fi
          done
          exit "$failed"

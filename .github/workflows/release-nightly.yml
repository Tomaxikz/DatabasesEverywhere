name: Release Nightly

# Builds main every night and publishes it as the `nightly` Docker image.
# Point compose at ghcr.io/tomaxikz/databaseseverywhere:nightly to use it.
on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: databases-everywhere-nightly
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  nightly:
    name: Build and publish nightly image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No build cache, so a poisoned cache can't reach a published image.
      - name: Build and verify binary
        uses: ./.github/actions/build-binary
        with:
          asset-arch: x86_64
          rust-target: x86_64-unknown-linux-gnu
          rust-targets: x86_64-unknown-linux-gnu

      - name: Build, scan and publish
        uses: ./.github/actions/publish-image
        with:
          binaries: target/release-artifacts
          tags: nightly
          token: ${{ secrets.GITHUB_TOKEN }}

name: MySQL and MariaDB driver compatibility

on:
  workflow_call:

permissions:
  contents: read

jobs:
  driver-case:
    name: ${{ matrix.image }} with Connector/J ${{ matrix.connector }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - protocol: mysql
            image: mysql:8.4
            connector: 8.4.0
          - protocol: mysql
            image: mysql:8.4
            connector: 9.7.0
          - protocol: mysql
            image: mysql:9.7
            connector: 9.2.0
          - protocol: mysql
            image: mysql:26.7
            connector: 9.7.0
          - protocol: mariadb
            image: mariadb:10.11
            connector: 8.4.0
          - protocol: mariadb
            image: mariadb:11.4
            connector: 9.2.0
          - protocol: mariadb
            image: mariadb:11.8
            connector: 9.7.0
          - protocol: mariadb
            image: mariadb:12.3
            connector: 9.7.0
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.95.0

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: dbev-debug
          cache-on-failure: false

      - name: Select hosted Java 21 and verify client toolchains
        run: |
          if [ -z "${JAVA_HOME_21_X64:-}" ] || \
             [ ! -x "$JAVA_HOME_21_X64/bin/java" ] || \
             [ ! -x "$JAVA_HOME_21_X64/bin/javac" ]; then
            echo "GitHub runner is missing its advertised Java 21 toolchain" >&2
            exit 1
          fi
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          for command in docker mvn openssl; do
            command -v "$command" >/dev/null || {
              echo "GitHub runner is missing required tool: $command" >&2
              exit 1
            }
          done

      - name: Compile the compatibility test
        run: cargo test --locked --lib --no-run

      - name: Exercise one real database and driver combination
        env:
          DBE_MATRIX_PROTOCOL: ${{ matrix.protocol }}
          DBE_MATRIX_IMAGE: ${{ matrix.image }}
          DBE_MATRIX_CONNECTOR: ${{ matrix.connector }}
          DBE_MARIADB_CLI_IMAGE: ${{ matrix.protocol == 'mariadb' && matrix.image || 'mariadb:11.4' }}
          DBE_DRIVER_CASE_TIMEOUT: 12m
        run: |
          bash .github/ci/mysql-driver-matrix.sh \
            "$DBE_MATRIX_PROTOCOL" \
            "$DBE_MATRIX_IMAGE" \
            "$DBE_MATRIX_CONNECTOR"

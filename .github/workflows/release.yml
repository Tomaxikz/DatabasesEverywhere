name: Release
run-name: Release ${{ inputs.version || github.ref_name }}

# Push a tag (`git tag v1.2.0 && git push origin v1.2.0`) or run it by hand.
# A prerelease (the checkbox, or a suffix like v1.2.0-rc.1) is not marked
# latest and does not move the Docker `latest` tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag, e.g. v1.2.0 or v1.2.0-rc.1"
        required: true
        type: string
      prerelease:
        description: "Prerelease (not latest, no Docker latest tag)"
        required: false
        default: false
        type: boolean
      draft:
        description: "Create the GitHub release as a draft (no Docker image)"
        required: false
        default: false
        type: boolean
      release_notes:
        description: "Markdown release notes; empty generates them"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: databases-everywhere-production-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release-gate:
    name: Validate release source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.validate.outputs.version }}
      prerelease: ${{ steps.validate.outputs.prerelease }}
      draft: ${{ steps.validate.outputs.draft }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate source, tag, and package version
        id: validate
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
          DRAFT: ${{ inputs.draft || false }}
          PRERELEASE: ${{ inputs.prerelease || false }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$VERSION" == *$'\r'* || "$VERSION" == *$'\n'* ]]; then
            echo "version must not contain CR or LF characters" >&2
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?(\+[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "version must be a complete SemVer tag prefixed with v" >&2
            exit 1
          fi

          case "$RELEASE_REF" in
            refs/heads/main|refs/tags/"$VERSION") ;;
            *)
              echo "releases may only run from protected main or the matching version tag" >&2
              exit 1
              ;;
          esac

          # A prerelease of the Cargo version needs no Cargo.toml change.
          package_version="$(cargo metadata --locked --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "databases-everywhere") | .version')"
          case "$VERSION" in
            "v${package_version}" | "v${package_version}"-*) ;;
            *)
              echo "release $VERSION must be v${package_version} or a prerelease of it, such as v${package_version}-rc.1" >&2
              exit 1
              ;;
          esac

          if git show-ref --verify --quiet "refs/tags/$VERSION"; then
            tag_commit="$(git rev-list -n 1 "$VERSION")"
            if [[ "$tag_commit" != "$RELEASE_SHA" ]]; then
              echo "existing tag $VERSION points to $tag_commit, not selected commit $RELEASE_SHA" >&2
              exit 1
            fi
          elif [[ "$RELEASE_REF" == refs/tags/* ]]; then
            echo "selected release tag $VERSION does not exist" >&2
            exit 1
          fi

          prerelease="$PRERELEASE"
          if [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+- ]]; then
            prerelease=true
          fi
          {
            echo "version=$VERSION"
            echo "prerelease=$prerelease"
            echo "draft=$DRAFT"
          } >> "$GITHUB_OUTPUT"

  security-audit:
    name: Security audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: release-gate
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.99.0

      - name: Install cargo-audit
        uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: cargo-audit@0.22.2
          fallback: none

      - name: Audit dependencies
        run: bash .github/ci/check.sh audit

  release-quality:
    name: Release lint and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: release-gate
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy

      - name: Install cargo-machete
        uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: cargo-machete@0.9.2
          fallback: none

      - name: Run locked release checks
        run: bash .github/ci/check.sh pre-push

  build:
    name: dbev-${{ matrix.asset_arch }}-linux
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    needs: release-gate
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - asset_arch: x86_64
            rust_target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
          - asset_arch: arm64
            rust_target: aarch64-unknown-linux-gnu
            rust_targets: aarch64-unknown-linux-gnu,aarch64-unknown-linux-musl
          - asset_arch: riscv64
            rust_target: riscv64gc-unknown-linux-gnu
            rust_targets: riscv64gc-unknown-linux-gnu,riscv64gc-unknown-linux-musl
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No build cache, so a poisoned cache can't reach a release.
      - name: Build and verify binary
        uses: ./.github/actions/build-binary
        with:
          asset-arch: ${{ matrix.asset_arch }}
          rust-target: ${{ matrix.rust_target }}
          rust-targets: ${{ matrix.rust_targets }}

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dbev-${{ matrix.asset_arch }}-linux
          path: target/release-artifacts/dbev-${{ matrix.asset_arch }}-linux
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  github-release:
    name: Create GitHub release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: production-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    needs:
      - release-gate
      - build
      - release-quality
      - security-audit
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Build release body
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail

          if [ -n "$RELEASE_NOTES" ]; then
            printf '%s\n' "$RELEASE_NOTES" > release-body.md
          else
            : > release-body.md
          fi

      - name: Attest release binaries
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/dbev-*-linux

      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.release-gate.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: DatabasesEverywhere ${{ needs.release-gate.outputs.version }}
          body_path: release-body.md
          generate_release_notes: ${{ inputs.release_notes == '' }}
          draft: ${{ needs.release-gate.outputs.draft == 'true' }}
          prerelease: ${{ needs.release-gate.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.release-gate.outputs.prerelease == 'true' && 'false' || 'true' }}
          fail_on_unmatched_files: true
          files: |
            dist/dbev-*-linux

      - name: Print release URL
        env:
          RELEASE_URL: ${{ steps.create_release.outputs.url }}
        run: |
          echo "Release URL: $RELEASE_URL"

  docker-image:
    name: Build, scan, and publish Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: production-release
    permissions:
      contents: read
      packages: write
    needs:
      - release-gate
      - github-release
    # Drafts are unpublished, so their image waits for a real release.
    if: ${{ needs.release-gate.outputs.draft != 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Compute Docker tags
        id: docker_tags
        env:
          VERSION: ${{ needs.release-gate.outputs.version }}
          PRERELEASE: ${{ needs.release-gate.outputs.prerelease }}
        run: |
          {
            echo "tags<<EOF"
            echo "$VERSION"
            if [ "$PRERELEASE" != "true" ]; then
              echo latest
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build, scan and publish
        uses: ./.github/actions/publish-image
        with:
          binaries: dist
          tags: ${{ steps.docker_tags.outputs.tags }}
          token: ${{ secrets.GITHUB_TOKEN }}

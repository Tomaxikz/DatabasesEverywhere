name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, for example v0.3.0"
        required: true
        type: string
      create_github_release:
        description: "Create a GitHub release and upload binaries"
        required: true
        default: true
        type: boolean
      draft:
        description: "Create the GitHub release as a draft"
        required: true
        default: false
        type: boolean
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        required: true
        default: false
        type: boolean
      release_notes:
        description: "Full Markdown release notes (use the GitHub CLI or API for multiple lines)"
        required: false
        default: ""
        type: string
      publish_docker:
        description: "Build and push the Docker image to GitHub Container Registry"
        required: true
        default: true
        type: boolean
      docker_latest:
        description: "Also publish the mutable latest tag (not recommended for deployments)"
        required: true
        default: false
        type: boolean
      docker_platforms:
        description: "Comma-separated Docker platforms to build"
        required: true
        default: "linux/amd64"
        type: string

permissions:
  contents: read

concurrency:
  group: databases-everywhere-production-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release-gate:
    name: Validate release source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate source, tag, and package version
        env:
          VERSION: ${{ inputs.version }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$VERSION" == *$'\r'* || "$VERSION" == *$'\n'* ]]; then
            echo "version must not contain CR or LF characters" >&2
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?(\+[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "version must be a complete SemVer tag such as v0.3.0" >&2
            exit 1
          fi

          case "$RELEASE_REF" in
            refs/heads/main|refs/tags/"$VERSION") ;;
            *)
              echo "releases may only run from protected main or the matching version tag" >&2
              exit 1
              ;;
          esac

          package_version="$(cargo metadata --locked --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "databases-everywhere") | .version')"
          if [[ "v${package_version}" != "$VERSION" ]]; then
            echo "release version $VERSION does not match Cargo package version v${package_version}" >&2
            exit 1
          fi

          if git show-ref --verify --quiet "refs/tags/$VERSION"; then
            tag_commit="$(git rev-list -n 1 "$VERSION")"
            if [[ "$tag_commit" != "$RELEASE_SHA" ]]; then
              echo "existing tag $VERSION points to $tag_commit, not selected commit $RELEASE_SHA" >&2
              exit 1
            fi
          elif [[ "$RELEASE_REF" == refs/tags/* ]]; then
            echo "selected release tag $VERSION does not exist" >&2
            exit 1
          fi

  security-audit:
    name: Security audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: release-gate
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.95.0

      - name: Install cargo-audit
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2.86.3
        with:
          tool: cargo-audit@0.22.2
          fallback: none

      - name: Audit dependencies
        run: bash .github/ci/check.sh audit

  release-quality:
    name: Release lint and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: release-gate
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: dbev-debug
          cache-on-failure: false

      - name: Run locked release checks
        run: bash .github/ci/check.sh pre-push

  release-driver-matrix:
    name: Release real MySQL/MariaDB clients and versions
    needs: release-gate
    permissions:
      contents: read
    uses: ./.github/workflows/mysql-driver-matrix.yml

  build:
    name: Linux release binaries
    needs: release-gate
    permissions:
      contents: read
    uses: ./.github/workflows/build-binaries.yml
    with:
      upload_artifacts: true

  github-release:
    name: Create GitHub release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: production-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    needs:
      - build
      - release-quality
      - release-driver-matrix
      - security-audit
    if: ${{ inputs.create_github_release }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Build release body
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail

          if [ -n "$RELEASE_NOTES" ]; then
            printf '%s\n' "$RELEASE_NOTES" > release-body.md
          else
            : > release-body.md
          fi

      - name: Attest release binaries
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/dbev-*-linux

      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: DatabasesEverywhere ${{ inputs.version }}
          body_path: release-body.md
          generate_release_notes: ${{ inputs.release_notes == '' }}
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          make_latest: ${{ inputs.prerelease && 'false' || 'true' }}
          fail_on_unmatched_files: true
          files: |
            dist/dbev-*-linux

      - name: Print release URL
        env:
          RELEASE_URL: ${{ steps.create_release.outputs.url }}
        run: |
          echo "Release URL: $RELEASE_URL"

  docker-image:
    name: Build Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production-release
    permissions:
      contents: read
      packages: write
    needs:
      - build
      - release-quality
      - release-driver-matrix
      - security-audit
      - github-release
    if: ${{ always() && needs.build.result == 'success' && needs.release-quality.result == 'success' && needs.release-driver-matrix.result == 'success' && needs.security-audit.result == 'success' && (inputs.create_github_release == false || needs.github-release.result == 'success') && inputs.publish_docker && !inputs.draft }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Prepare Docker binaries
        env:
          PLATFORMS: ${{ inputs.docker_platforms }}
        run: |
          set -euo pipefail

          prepare_binary() {
            platform="$1"
            case "$platform" in
              linux/amd64)
                docker_dir=".docker/amd64"
                asset="x86_64-linux"
                ;;
              *)
                echo "unsupported Docker platform: $platform" >&2
                exit 1
                ;;
            esac

            mkdir -p "$docker_dir"
            install -m 0755 "dist/dbev-${asset}" "${docker_dir}/dbev"
          }

          IFS=',' read -ra platform_list <<< "$PLATFORMS"
          for platform in "${platform_list[@]}"; do
            prepare_binary "$platform"
          done

      - name: Compute Docker tags
        id: docker_tags
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          VERSION: ${{ inputs.version }}
          DOCKER_LATEST: ${{ inputs.docker_latest }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          image="${IMAGE_NAME,,}"
          {
            echo "tags<<EOF"
            echo "${image}:${VERSION}"
            if [ "$DOCKER_LATEST" = "true" ] && [ "$PRERELEASE" != "true" ]; then
              echo "${image}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: ${{ inputs.docker_platforms }}
          push: true
          tags: ${{ steps.docker_tags.outputs.tags }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

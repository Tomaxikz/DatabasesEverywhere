name: Release
run-name: Release ${{ inputs.version || github.ref_name }}

# Push a tag (`git tag v1.2.0 && git push origin v1.2.0`) or run it by hand.
# A prerelease (the checkbox, or a suffix like v1.2.0-rc.1) is not marked
# latest and does not move the Docker `latest` tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag, e.g. v1.2.0 or v1.2.0-rc.1"
        required: true
        type: string
      prerelease:
        description: "Prerelease (not latest, no Docker latest tag)"
        required: false
        default: false
        type: boolean
      draft:
        description: "Create the GitHub release as a draft (no Docker image)"
        required: false
        default: false
        type: boolean
      release_notes:
        description: "Markdown release notes; empty generates them"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: databases-everywhere-production-release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  DOCKER_PLATFORMS: linux/amd64

jobs:
  release-gate:
    name: Validate release source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.validate.outputs.version }}
      prerelease: ${{ steps.validate.outputs.prerelease }}
      draft: ${{ steps.validate.outputs.draft }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate source, tag, and package version
        id: validate
        env:
          VERSION: ${{ inputs.version || github.ref_name }}
          DRAFT: ${{ inputs.draft || false }}
          PRERELEASE: ${{ inputs.prerelease || false }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$VERSION" == *$'\r'* || "$VERSION" == *$'\n'* ]]; then
            echo "version must not contain CR or LF characters" >&2
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?(\+[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "version must be a complete SemVer tag prefixed with v" >&2
            exit 1
          fi

          case "$RELEASE_REF" in
            refs/heads/main|refs/tags/"$VERSION") ;;
            *)
              echo "releases may only run from protected main or the matching version tag" >&2
              exit 1
              ;;
          esac

          # A prerelease of the Cargo version needs no Cargo.toml change.
          package_version="$(cargo metadata --locked --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "databases-everywhere") | .version')"
          case "$VERSION" in
            "v${package_version}" | "v${package_version}"-*) ;;
            *)
              echo "release $VERSION must be v${package_version} or a prerelease of it, such as v${package_version}-rc.1" >&2
              exit 1
              ;;
          esac

          if git show-ref --verify --quiet "refs/tags/$VERSION"; then
            tag_commit="$(git rev-list -n 1 "$VERSION")"
            if [[ "$tag_commit" != "$RELEASE_SHA" ]]; then
              echo "existing tag $VERSION points to $tag_commit, not selected commit $RELEASE_SHA" >&2
              exit 1
            fi
          elif [[ "$RELEASE_REF" == refs/tags/* ]]; then
            echo "selected release tag $VERSION does not exist" >&2
            exit 1
          fi

          prerelease="$PRERELEASE"
          if [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+- ]]; then
            prerelease=true
          fi
          {
            echo "version=$VERSION"
            echo "prerelease=$prerelease"
            echo "draft=$DRAFT"
          } >> "$GITHUB_OUTPUT"

  security-audit:
    name: Security audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: release-gate
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.95.0

      - name: Install cargo-audit
        uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: cargo-audit@0.22.2
          fallback: none

      - name: Audit dependencies
        run: bash .github/ci/check.sh audit

  release-quality:
    name: Release lint and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: release-gate
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Install cargo-machete
        uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2.87.17
        with:
          tool: cargo-machete@0.9.2
          fallback: none

      - name: Run locked release checks
        run: bash .github/ci/check.sh pre-push

  release-driver-matrix:
    name: Release real MySQL/MariaDB clients and versions
    needs: release-gate
    permissions:
      contents: read
    uses: ./.github/workflows/mysql-driver-matrix.yml

  build:
    name: Linux release binaries
    needs: release-gate
    permissions:
      contents: read
    uses: ./.github/workflows/build-binaries.yml
    with:
      upload_artifacts: true

  github-release:
    name: Create GitHub release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: production-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    needs:
      - release-gate
      - build
      - release-quality
      - release-driver-matrix
      - security-audit
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Build release body
        env:
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail

          if [ -n "$RELEASE_NOTES" ]; then
            printf '%s\n' "$RELEASE_NOTES" > release-body.md
          else
            : > release-body.md
          fi

      - name: Attest release binaries
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/dbev-*-linux

      - name: Create release
        id: create_release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.release-gate.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: DatabasesEverywhere ${{ needs.release-gate.outputs.version }}
          body_path: release-body.md
          generate_release_notes: ${{ inputs.release_notes == '' }}
          draft: ${{ needs.release-gate.outputs.draft == 'true' }}
          prerelease: ${{ needs.release-gate.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.release-gate.outputs.prerelease == 'true' && 'false' || 'true' }}
          fail_on_unmatched_files: true
          files: |
            dist/dbev-*-linux

      - name: Print release URL
        env:
          RELEASE_URL: ${{ steps.create_release.outputs.url }}
        run: |
          echo "Release URL: $RELEASE_URL"

  docker-image:
    name: Build, scan, and publish Docker image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: production-release
    permissions:
      contents: read
      packages: write
    needs:
      - release-gate
      - github-release
    # Drafts are unpublished, so their image waits for a real release.
    if: ${{ needs.release-gate.outputs.draft != 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Prepare Docker binaries
        env:
          PLATFORMS: ${{ env.DOCKER_PLATFORMS }}
        run: |
          set -euo pipefail

          prepare_binary() {
            platform="$1"
            case "$platform" in
              linux/amd64)
                docker_dir=".docker/amd64"
                asset="x86_64-linux"
                ;;
              *)
                echo "unsupported Docker platform: $platform" >&2
                exit 1
                ;;
            esac

            mkdir -p "$docker_dir"
            install -m 0755 "dist/dbev-${asset}" "${docker_dir}/dbev"
          }

          IFS=',' read -ra platform_list <<< "$PLATFORMS"
          for platform in "${platform_list[@]}"; do
            prepare_binary "$platform"
          done

      - name: Compute Docker tags
        id: docker_tags
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          VERSION: ${{ needs.release-gate.outputs.version }}
          PRERELEASE: ${{ needs.release-gate.outputs.prerelease }}
        run: |
          set -euo pipefail
          image="${IMAGE_NAME,,}"
          {
            echo "tags<<EOF"
            echo "${image}:${VERSION}"
            if [ "$PRERELEASE" != "true" ]; then
              echo "${image}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Install image scanning and publishing tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends skopeo
          mkdir -p "$RUNNER_TEMP/trivy-bin"
          curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
            --connect-timeout 10 --max-time 120 \
            https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz \
            --output "$RUNNER_TEMP/trivy.tar.gz"
          printf '%s  %s\n' \
            '2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a' \
            "$RUNNER_TEMP/trivy.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP/trivy-bin" trivy
          echo "$RUNNER_TEMP/trivy-bin" >> "$GITHUB_PATH"

      - name: Build Docker image without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: ${{ env.DOCKER_PLATFORMS }}
          push: false
          # Assign registry tags only when copying after the scan; keep one OCI root.
          outputs: type=oci,dest=${{ runner.temp }}/dbev-image,tar=false
          provenance: mode=max
          sbom: true
          # Re-fetch security indexes and upgrade packages on every release.
          # This image copies prebuilt Rust binaries; no compiler cache is lost.
          no-cache: true

      - name: Scan the release image
        id: trivy
        run: |
          trivy image --input "$RUNNER_TEMP/dbev-image" \
            --platform linux/amd64 --scanners vuln --severity HIGH,CRITICAL \
            --exit-code 1 --timeout 10m --format json \
            --output "$RUNNER_TEMP/trivy-report.json"

      - name: Print image vulnerability report
        if: ${{ !cancelled() && steps.trivy.outcome != 'skipped' }}
        run: |
          if [ ! -s "$RUNNER_TEMP/trivy-report.json" ]; then
            echo "::error::Trivy produced no report. Check the scan step for a scanner or database-download error."
            exit 1
          fi
          trivy convert --format table "$RUNNER_TEMP/trivy-report.json"

      - name: Upload image vulnerability report
        if: ${{ !cancelled() && steps.trivy.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-vulnerability-report
          path: ${{ runner.temp }}/trivy-report.json
          if-no-files-found: error
          retention-days: 7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the scanned image and its attestations
        env:
          IMAGE_TAGS: ${{ steps.docker_tags.outputs.tags }}
        run: |
          # Copy the exact scanned OCI image, including SBOM/provenance, without rebuilding.
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            skopeo copy --all --preserve-digests --retry-times 3 \
              "oci:$RUNNER_TEMP/dbev-image" "docker://$tag"
          done <<< "$IMAGE_TAGS"

name: Publish Docker image
description: Builds the image from a prebuilt x86_64 binary, scans it and pushes it to GHCR.

inputs:
  binaries:
    description: Folder holding dbev-x86_64-linux
    required: true
  tags:
    description: Image tags without the image name, one per line
    required: true
  token:
    description: Token allowed to push to GHCR
    required: true

runs:
  using: composite
  steps:
    - name: Prepare Docker binary
      shell: bash
      env:
        BINARIES: ${{ inputs.binaries }}
      run: |
        mkdir -p .docker/amd64
        install -m 0755 "$BINARIES/dbev-x86_64-linux" .docker/amd64/dbev

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Install image scanning and publishing tools
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --yes --no-install-recommends skopeo
        mkdir -p "$RUNNER_TEMP/trivy-bin"
        curl --fail --location --proto '=https' --tlsv1.2 --retry 3 \
          --connect-timeout 10 --max-time 120 \
          https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-64bit.tar.gz \
          --output "$RUNNER_TEMP/trivy.tar.gz"
        printf '%s  %s\n' \
          '2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a' \
          "$RUNNER_TEMP/trivy.tar.gz" | sha256sum --check --strict
        tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP/trivy-bin" trivy

    - name: Build Docker image without publishing
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        file: deploy/docker/Dockerfile
        platforms: linux/amd64
        push: false
        # Registry tags are added when copying after the scan; keep one OCI root.
        outputs: type=oci,dest=${{ runner.temp }}/dbev-image,tar=false
        provenance: mode=max
        sbom: true
        # Fresh security indexes and package upgrades every time. The image
        # copies a prebuilt binary, so no compiler cache is lost.
        no-cache: true

    - name: Scan the image
      id: trivy
      shell: bash
      run: |
        "$RUNNER_TEMP/trivy-bin/trivy" image --input "$RUNNER_TEMP/dbev-image" \
          --platform linux/amd64 --scanners vuln --severity HIGH,CRITICAL \
          --exit-code 1 --timeout 10m --format json \
          --output "$RUNNER_TEMP/trivy-report.json"

    - name: Print image vulnerability report
      if: ${{ !cancelled() && steps.trivy.outcome != 'skipped' }}
      shell: bash
      run: |
        if [ ! -s "$RUNNER_TEMP/trivy-report.json" ]; then
          echo "::error::Trivy produced no report. Check the scan step for a scanner or database-download error."
          exit 1
        fi
        "$RUNNER_TEMP/trivy-bin/trivy" convert --format table "$RUNNER_TEMP/trivy-report.json"

    - name: Upload image vulnerability report
      if: ${{ !cancelled() && steps.trivy.outcome != 'skipped' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: docker-vulnerability-report
        path: ${{ runner.temp }}/trivy-report.json
        if-no-files-found: error
        retention-days: 7

    - name: Login to GitHub Container Registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}

    - name: Publish the scanned image and its attestations
      shell: bash
      env:
        IMAGE_NAME: ghcr.io/${{ github.repository }}
        IMAGE_TAGS: ${{ inputs.tags }}
      run: |
        set -euo pipefail
        image="${IMAGE_NAME,,}"
        # Copy the exact scanned OCI image, including SBOM/provenance, without rebuilding.
        while IFS= read -r tag; do
          [ -n "$tag" ] || continue
          skopeo copy --all --preserve-digests --retry-times 3 \
            "oci:$RUNNER_TEMP/dbev-image" "docker://${image}:${tag}"
        done <<< "$IMAGE_TAGS"

[alias]
b = "run --quiet --locked --package dbev-release-builder --target-dir target/cargo-b-tool --"
check-linux = "check --workspace --all-targets --locked --target x86_64-unknown-linux-gnu"
build-linux = "build --package databases-everywhere --bin dbev --release --locked --target x86_64-unknown-linux-gnu"
test-linux = "test --workspace --locked --target x86_64-unknown-linux-gnu"

openapi: 3.1.0
info:
  title: DatabasesEverywhere API
  version: 0.10.0
  description: API used by panels/addons to create, manage, monitor, back up, and restore hosted database instances.
servers:
  - url: http://127.0.0.1:8090
    description: Local daemon API
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: panel token
  schemas:
    Protocol:
      type: string
      enum: [postgres, redis, valkey, mariadb, mysql, mongodb, clickhouse, qdrant]
    LimitsRequest:
      type: object
      additionalProperties: false
      required: [cpu_cores, memory_mib, disk_mib]
      properties:
        cpu_cores:
          type: number
          minimum: 0.01
          maximum: 1024
          example: 0.5
        memory_mib:
          type: integer
          minimum: 1
          maximum: 1048576
          example: 512
        disk_mib:
          type: integer
          minimum: 1
          example: 1024
    InstanceLimits:
      allOf:
        - $ref: "#/components/schemas/LimitsRequest"
        - type: object
          properties:
            disk_enforced:
              type: boolean
            disk_enforcement_method:
              type: string
              example: host_filesystem_quota
    CreateInstanceRequest:
      type: object
      additionalProperties: false
      required: [instance_id, protocol, database, username, password, public_host]
      properties:
        instance_id:
          type: string
          example: inst_server_123_pg
        protocol:
          $ref: "#/components/schemas/Protocol"
        database:
          type: string
          example: server_123
        username:
          type: string
          example: app_server_123
        password:
          type: string
          format: password
        public_host:
          type: string
          example: db.example.com
        public_port:
          type: [integer, "null"]
          example: 5434
        image:
          type: [string, "null"]
          example: postgres:18.4
          description: Optional pinned container image for this instance. The image must be the configured default or listed in images.allowed.<protocol>; omit this field to use the node default.
        project_id:
          type: [string, "null"]
          example: server-123
        limits:
          $ref: "#/components/schemas/LimitsRequest"
        purge_stale_resources:
          type: boolean
          default: false
          description: Irreversibly remove an orphaned container and persistent paths for this instance_id before retrying creation. Requires purge_stale_resources_confirmation.
        purge_stale_resources_confirmation:
          oneOf:
            - $ref: "#/components/schemas/DestructiveActionConfirmation"
            - type: "null"
    Instance:
      type: object
      required: [schema_version, instance_id, protocol, status, public, backend, runtime, database, limits, created_at, updated_at]
      properties:
        schema_version:
          type: integer
        instance_id:
          type: string
        protocol:
          $ref: "#/components/schemas/Protocol"
        status:
          type: string
          enum: [creating, booting, running, stopped, failed, quarantined, deleting]
        public:
          type: object
          required: [host, port]
          properties:
            host:
              type: string
            port:
              type: integer
        backend:
          description: >-
            Active instances use unix_socket. docker_tcp is returned only for
            legacy records quarantined during migration and is never connected.
          oneOf:
            - type: object
              required: [kind, socket_path]
              properties:
                kind:
                  type: string
                  const: unix_socket
                socket_path:
                  type: string
            - type: object
              required: [kind, host, port]
              properties:
                kind:
                  type: string
                  const: docker_tcp
                host:
                  type: string
                port:
                  type: integer
        runtime:
          type: object
          required: [kind, container_name, network_mode]
          properties:
            kind:
              type: string
              example: docker
            container_name:
              type: string
            network_mode:
              type: string
              const: none
        database:
          type: object
          required: [name, username]
          properties:
            name:
              type: string
            username:
              type: string
        route_key_sha256:
          type: string
          description: Optional SHA-256 fingerprint of the instance gateway route key.
        limits:
          $ref: "#/components/schemas/InstanceLimits"
        image:
          type: object
          required: [current, configured, update_available]
          properties:
            current:
              type: [string, "null"]
            configured:
              type: string
            update_available:
              type: boolean
        database_version:
          type: object
          required: [current, error]
          properties:
            current:
              type: [string, "null"]
            error:
              oneOf:
                - $ref: "#/components/schemas/PublicDiagnostic"
                - type: "null"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SystemResponse:
      type: object
      additionalProperties: false
      required: [service, version, api_version, api_readiness, uuid, token_id, remote, api_host, api_port, api_bind, api_ssl_enabled, api_rate_limit_per_minute, api_rate_limit_scope, daemon_engine, daemon_socket, database_container_network_mode, database_backend_transport, daemon_disk_limits_enforced, disk_mode, prevent_cpu_overallocation, prevent_memory_overallocation, prevent_disk_overallocation, remote_import_enabled, postgres_enabled, redis_enabled, valkey_enabled, mariadb_enabled, mysql_enabled, mongodb_enabled, clickhouse_enabled, clickhouse_http_enabled, clickhouse_http_bind, clickhouse_http_port, qdrant_enabled, gateways]
      properties:
        service: {type: string, const: databases-everywhere}
        version: {type: string}
        api_version: {type: string, example: 0.10.0}
        api_readiness:
          type: string
          const: ready
          description: Readiness of the management API itself. Database listener readiness is reported separately under gateways.
        uuid: {type: string}
        token_id: {type: string}
        remote: {type: string, format: uri}
        api_host: {type: string}
        api_port: {type: integer}
        api_bind: {type: string}
        api_ssl_enabled: {type: boolean}
        api_rate_limit_per_minute:
          type: integer
          minimum: 1
          description: Fixed-window request allowance for each authenticated credential and transport-peer IP.
        api_rate_limit_scope:
          type: string
          const: credential_and_peer_ip
        daemon_engine: {type: string, enum: [docker, podman]}
        daemon_socket: {type: string}
        database_container_network_mode: {type: string, const: none}
        database_backend_transport: {type: string, const: unix_socket}
        daemon_disk_limits_enforced: {type: boolean}
        disk_mode: {type: string}
        prevent_cpu_overallocation:
          type: boolean
          description: Whether create and limit-increase admission prevents configured CPU reservations from exceeding detected host cores.
        prevent_memory_overallocation:
          type: boolean
          description: Whether create and limit-increase admission enforces the configured memory pool and reserve.
        prevent_disk_overallocation:
          type: boolean
          description: Whether create and limit-increase admission enforces the configured disk pool and reserve.
        remote_import_enabled:
          type: boolean
          description: Whether this node accepts credential-based remote import sources.
        postgres_enabled: {type: boolean}
        redis_enabled: {type: boolean}
        valkey_enabled: {type: boolean}
        mariadb_enabled: {type: boolean}
        mysql_enabled: {type: boolean}
        mongodb_enabled: {type: boolean}
        clickhouse_enabled: {type: boolean}
        clickhouse_http_enabled: {type: boolean}
        clickhouse_http_bind: {type: string}
        clickhouse_http_port: {type: integer}
        qdrant_enabled: {type: boolean}
        gateways:
          $ref: "#/components/schemas/GatewayReadiness"
    HeartbeatResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: {type: string, const: ok}
    GatewayReadiness:
      type: object
      additionalProperties: false
      required: [status, expected_listeners, ready_listeners]
      properties:
        status: {type: string, enum: [starting, ready, failed, stopping]}
        expected_listeners: {type: integer, minimum: 0}
        ready_listeners: {type: integer, minimum: 0}
        failure: {type: string}
    InstanceStatusResponse:
      type: object
      required: [instance_id, status]
      properties:
        instance_id: {type: string}
        status:
          type: string
          enum: [creating, booting, running, stopped, failed, quarantined, deleting]
        progress:
          $ref: "#/components/schemas/InstallProgress"
    CreateInstanceAcceptedResponse:
      type: object
      additionalProperties: false
      required: [instance_id, status, status_url]
      properties:
        instance_id: {type: string}
        status:
          type: string
          const: creating
        status_url:
          type: string
          description: Origin-relative URL for polling creation status and progress.
    InstallProgress:
      type: object
      additionalProperties: false
      required: [instance_id, protocol, action, status, stage, message, image, layer, current, total, percent, updated_at]
      properties:
        instance_id: {type: string}
        protocol: {$ref: "#/components/schemas/Protocol"}
        action: {type: string, enum: [create, image_update, major_upgrade]}
        status: {type: string, enum: [running, completed, failed]}
        stage: {type: string}
        message: {type: string}
        image: {type: [string, "null"]}
        layer: {type: [string, "null"]}
        current: {type: [integer, "null"]}
        total: {type: [integer, "null"]}
        percent: {type: [number, "null"]}
        diagnostic:
          $ref: "#/components/schemas/PublicDiagnostic"
        updated_at: {type: string, format: date-time}
    DeleteInstanceResponse:
      type: object
      required: [instance_id, deleted, purged]
      properties:
        instance_id: {type: string}
        deleted: {type: boolean}
        purged: {type: boolean}
    Error:
      type: object
      additionalProperties: false
      required: [error, code]
      properties:
        error:
          type: string
        code:
          type: string
        error_id:
          type: string
          format: uuid
          description: Opaque support identifier included only for server-side failures.
    PublicDiagnostic:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string, maxLength: 512}
        error_id:
          type: string
          format: uuid
          description: Opaque identifier for correlating an internal asynchronous failure with daemon logs.
    ImportRequest:
      type: object
      additionalProperties: false
      required: [source]
      properties:
        source:
          oneOf:
            - $ref: "#/components/schemas/ArtifactImportSource"
            - $ref: "#/components/schemas/RemoteImportSource"
          discriminator:
            propertyName: type
            mapping:
              artifact: "#/components/schemas/ArtifactImportSource"
              remote: "#/components/schemas/RemoteImportSource"
        mode:
          type: string
          enum: [merge, wipe]
          default: merge
          description: >-
            For credential imports, merge replaces source-named
            objects/keys/collections while preserving target-only data; wipe
            clears the target database first. Redis, Valkey, and Qdrant artifact imports
            always replace the complete physical database, so mode does not
            change their behavior.
        selection:
          $ref: "#/components/schemas/ImportExportSelection"
    ExportRequest:
      type: object
      additionalProperties: false
      properties:
        archive_format:
          type: [string, "null"]
          enum: [plain, gzip, bzip2, null]
        selection:
          $ref: "#/components/schemas/ImportExportSelection"
    ArtifactImportSource:
      type: object
      additionalProperties: false
      required: [type, artifact_id]
      properties:
        type:
          type: string
          const: artifact
        artifact_id:
          type: string
          description: ID returned by this instance's artifacts endpoint, or the filename of an operator-staged file under paths.imports/<instance_id>/.
        archive_format:
          type: [string, "null"]
          enum: [plain, gzip, bzip2, tar, tar.gz, zip, null]
          description: Archive wrapper to remove before import. Omit for an unwrapped dump and for Redis/Valkey/Qdrant physical archives.
    RemoteImportSource:
      type: object
      additionalProperties: false
      required: [type, host]
      description: Protocol-specific remote credentials. Qdrant imports also migrate aliases attached to selected source collections; source aliases win same-name conflicts.
      properties:
        type:
          type: string
          const: remote
        host:
          type: string
          minLength: 1
          maxLength: 253
          description: DNS name or literal IP only after surrounding whitespace is removed; URLs, paths, userinfo, and embedded ports are rejected.
          example: source-db.example.com
        port:
          type: [integer, "null"]
          minimum: 1
          maximum: 65535
          description: Optional protocol port. A TLS-aware protocol default is used when omitted.
        tls:
          type: boolean
          default: true
          description: Verified TLS is the default. Plaintext also requires security.remote_import.allow_plaintext on the node.
        database:
          type: [string, "null"]
          minLength: 1
          maxLength: 256
          pattern: '^[^\u0000-\u001F\u007F-\u009F]+$'
          description: Required for PostgreSQL, MariaDB, MySQL, MongoDB, and ClickHouse. The trimmed value must occupy 1-256 UTF-8 bytes and contain no control characters. Omit for Redis, Valkey, and Qdrant. MariaDB/MySQL additionally allow at most 64 characters. MongoDB applies a 63-byte limit and rejects slash, backslash, dot, space, double quote, and dollar sign. ClickHouse additionally requires at most 128 ASCII letters, digits, underscores, or dashes.
        username:
          type: [string, "null"]
          minLength: 1
          maxLength: 256
          pattern: '^[^\u0000-\u001F\u007F-\u009F]+$'
          description: Required for SQL/ClickHouse. The trimmed value must occupy 1-256 UTF-8 bytes and contain no control characters. Optional with password for MongoDB, Redis, and Valkey ACL authentication.
        password:
          type: [string, "null"]
          format: password
          writeOnly: true
          description: Source credentials are not stored in durable job records or metadata. SQL, MongoDB, and ClickHouse acquisition may place this value in a mode-0600 job-private temporary file that is removed immediately after the helper exits; Redis and Valkey keep it in process memory. SQL passwords cannot contain NUL, CR, or LF.
        authentication_database:
          type: [string, "null"]
          minLength: 1
          maxLength: 256
          pattern: '^[^\u0000-\u001F\u007F-\u009F]+$'
          description: Optional MongoDB authentication database. It follows MongoDB's 63-byte database-name restrictions or may be exactly $external. Defaults to database and is accepted only when username and password are both supplied.
        database_index:
          type: [integer, "null"]
          minimum: 0
          maximum: 4294967295
          description: Redis or Valkey logical database index. Defaults to 0.
        api_key:
          type: [string, "null"]
          format: password
          writeOnly: true
          description: Optional Qdrant API key kept in process memory and not stored in a credential file, durable job record, or job metadata. It must be a syntactically valid HTTP header value and permit cluster-topology, collection, and alias reads plus snapshot creation, download, and cleanup.
    ImportExportSelection:
      type: object
      additionalProperties: false
      properties:
        mode:
          type: string
          enum: [full, selective]
          default: full
        include:
          type: array
          description: Required and non-empty when mode is selective. MongoDB credential imports accept multiple collection names; MongoDB exports accept exactly one.
          items:
            type: string
        exclude:
          type: array
          items:
            type: string
        fields:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    ImportExportJob:
      type: object
      required: [job_id, instance_id, action, status, artifact_id, artifact_size_bytes, error, created_at, updated_at]
      properties:
        job_id:
          type: string
        instance_id:
          type: string
        action:
          type: string
          enum: [export, import]
        status:
          type: string
          enum: [queued, running, succeeded, failed]
        artifact_id:
          type: [string, "null"]
        artifact_size_bytes:
          type: [integer, "null"]
        error:
          oneOf:
            - $ref: "#/components/schemas/PublicDiagnostic"
            - type: "null"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    StoredArtifact:
      type: object
      required: [id, instance_id, size_bytes, modified_at, sha256]
      properties:
        id:
          type: string
        instance_id:
          type: string
        size_bytes:
          type: integer
        modified_at:
          type: string
          format: date-time
        sha256:
          type: string
    CreateDownloadRequest:
      type: object
      additionalProperties: false
      properties:
        expires_in_seconds:
          type: integer
          minimum: 1
          maximum: 900
          default: 120
        single_use:
          type: boolean
          default: true
    DownloadUrlResponse:
      type: object
      additionalProperties: false
      required: [url, expires_at_unix, single_use]
      properties:
        url:
          type: string
          description: Origin-relative temporary download URL containing the short-lived capability.
        expires_at_unix: {type: integer}
        single_use: {type: boolean}
    DeleteArtifactResponse:
      type: object
      required: [id, deleted]
      properties:
        id: {type: string}
        deleted: {type: boolean}
    RetentionResponse:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: array
          items: {type: string}
    BackupStatusResponse:
      type: object
      additionalProperties: false
      required: [enabled, interval_minutes, run_on_startup, retention_keep_latest_per_instance, retention_max_age_days, redis_excluded, storage_driver, browsing_enabled]
      properties:
        enabled: {type: boolean}
        interval_minutes: {type: integer}
        run_on_startup: {type: boolean}
        retention_keep_latest_per_instance: {type: integer}
        retention_max_age_days: {type: integer}
        redis_excluded: {type: boolean}
        storage_driver:
          type: string
          enum: [local, s3, kopia]
        browsing_enabled: {type: boolean}
    BackupCatalogColumn:
      type: object
      additionalProperties: false
      required: [name, data_type, nullable, ordinal]
      properties:
        name: {type: string}
        data_type: {type: string}
        "nullable": {type: boolean}
        ordinal: {type: integer, minimum: 1}
    BackupObjectSummary:
      type: object
      additionalProperties: false
      required: [id, namespace, name, kind, estimated_rows, columns, captured_preview_rows, preview_truncated]
      properties:
        id: {type: string}
        namespace: {type: string}
        name: {type: string}
        kind: {type: string}
        estimated_rows: {type: [integer, "null"]}
        columns:
          type: array
          items: {$ref: "#/components/schemas/BackupCatalogColumn"}
        captured_preview_rows: {type: integer, minimum: 0}
        preview_truncated: {type: boolean}
    BackupObjectSelection:
      type: object
      additionalProperties: false
      required: [object_id, offset, limit, returned, total_captured, rows, truncated]
      properties:
        object_id: {type: string}
        offset: {type: integer, minimum: 0}
        limit: {type: integer, minimum: 1, maximum: 100}
        returned: {type: integer, minimum: 0}
        total_captured: {type: integer, minimum: 0}
        rows:
          type: array
          items: {}
        truncated: {type: boolean}
    BackupContentsResponse:
      type: object
      additionalProperties: false
      required: [backup_id, instance_id, protocol, database_name, captured_at, consistency, catalog_available, truncated, warnings, objects, selection]
      properties:
        backup_id: {type: string}
        instance_id: {type: string}
        protocol: {$ref: "#/components/schemas/Protocol"}
        database_name: {type: string}
        captured_at: {type: [string, "null"], format: date-time}
        consistency: {type: [string, "null"]}
        catalog_available: {type: boolean}
        truncated: {type: boolean}
        warnings:
          type: array
          items: {type: string}
        objects:
          type: array
          items: {$ref: "#/components/schemas/BackupObjectSummary"}
        selection:
          oneOf:
            - $ref: "#/components/schemas/BackupObjectSelection"
            - type: "null"
    SkippedBackup:
      type: object
      required: [instance_id, protocol, reason]
      properties:
        instance_id: {type: string}
        protocol: {$ref: "#/components/schemas/Protocol"}
        reason: {$ref: "#/components/schemas/PublicDiagnostic"}
    RunBackupsResponse:
      type: object
      additionalProperties: false
      required: [backups, skipped]
      properties:
        backups:
          type: array
          items: {$ref: "#/components/schemas/StoredArtifact"}
        skipped:
          type: array
          items: {$ref: "#/components/schemas/SkippedBackup"}
    RestoreBackupResponse:
      type: object
      additionalProperties: false
      required: [instance_id, backup_id, restored]
      properties:
        instance_id: {type: string}
        backup_id: {type: string}
        restored: {type: boolean}
    DestructiveActionConfirmation:
      type: object
      additionalProperties: false
      required: [confirm, reason]
      properties:
        confirm:
          type: boolean
          const: true
        reason:
          type: string
          minLength: 1
          maxLength: 512
    WsTokenRequest:
      type: object
      additionalProperties: false
      required: [subject, scopes]
      properties:
        subject:
          type: string
        scopes:
          type: array
          items:
            type: string
            enum: [monitor:read, logs:read, import-export:read]
          example: [monitor:read]
        instances:
          type: array
          items:
            type: string
          default: []
          maxItems: 256
          description: Explicit instance allow-list. Must be non-empty unless all_instances is true.
        all_instances:
          type: boolean
          default: false
          description: Explicitly grants node-wide instance access and cannot be combined with a non-empty instances list.
        ttl_seconds:
          type: integer
          minimum: 1
          maximum: 3600
          default: 900
    WsTokenResponse:
      type: object
      required: [token_type, token, expires_at_unix]
      properties:
        token_type: {type: string, const: Bearer}
        token: {type: string}
        expires_at_unix: {type: integer}
    PowerRequest:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action:
          type: string
          enum: [start, stop, restart, kill]
    PowerResponse:
      type: object
      required: [action, instance]
      properties:
        action:
          type: string
          enum: [start, stop, restart, kill]
        instance:
          $ref: "#/components/schemas/Instance"
    ResetInstancePasswordRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          maxLength: 4096
          pattern: '^[^\u0000\r\n]+$'
          description: New tenant database password or, for Qdrant, API key. It is never returned; DBE stores it only in its encrypted private credential repository for rollback and future managed recreation.
    ResetInstancePasswordResponse:
      type: object
      additionalProperties: false
      required: [instance, restarted]
      properties:
        instance:
          $ref: "#/components/schemas/Instance"
        restarted:
          type: boolean
          description: True only when immutable startup credentials require container recreation (ClickHouse, Qdrant, and one-time migration of legacy Redis/Valkey instances without a stored encrypted credential); false for native in-place rotation.
    UpdateInstanceImageRequest:
      type: object
      additionalProperties: false
      required: [image]
      properties:
        image:
          type: string
          example: mongo:8.3.4
          description: Pinned target image. Must be the configured default image or listed in images.allowed.<protocol>. Bare images and latest tags are rejected.
        password:
          type: [string, "null"]
          format: password
          description: Current tenant database password. Used only as a compatibility fallback for legacy instances that predate encrypted tenant credential storage; current instances use their protected stored credential.
        major_upgrade:
          type: boolean
          default: false
          description: Set true only after an explicit admin confirmation when the image changes database major version. DBE then runs its export/import migration workflow instead of a same-volume recreate.
    ImageUpdateStrategy:
      type: string
      enum: [in_place_recreate, major_upgrade_migration]
    UpdateInstanceImageResponse:
      type: object
      properties:
        instance:
          $ref: "#/components/schemas/Instance"
        image:
          type: string
          description: Target image applied to the instance.
        recreated:
          type: boolean
        strategy:
          $ref: "#/components/schemas/ImageUpdateStrategy"
        warnings:
          type: array
          items:
            type: string
          description: Provider-style warnings the panel should show after a successful upgrade.
        export_artifact_id:
          type: [string, "null"]
          description: Logical export artifact kept after a major upgrade for rollback/audit.
        old_volume_backup_retained:
          type: boolean
          description: Whether the old volume was retained on the node for manual rollback.
    ConfigPatchResponse:
      type: object
      required: [applied, restart_required, config_path]
      properties:
        applied:
          type: boolean
        restart_required:
          type: boolean
        config_path:
          type: string
    LogsResponse:
      type: object
      required: [instance_id, stdout, stderr]
      properties:
        instance_id: {type: string}
        stdout: {type: string}
        stderr: {type: string}
    ResourceReport:
      type: object
      required: [instance_id, protocol, status, cpu, memory, disk, network]
      properties:
        instance_id: {type: string}
        protocol: {type: string}
        status: {type: string}
        cpu:
          type: object
          required: [configured_cores, usage_percent]
          properties:
            configured_cores: {type: number}
            usage_percent: {type: [number, "null"]}
        memory:
          type: object
          required: [configured_mib, usage_bytes, limit_bytes]
          properties:
            configured_mib: {type: integer}
            usage_bytes: {type: [integer, "null"]}
            limit_bytes: {type: [integer, "null"]}
        disk:
          type: object
          required: [configured_mib, limit_bytes, used_bytes, enforced, enforcement_method]
          properties:
            configured_mib: {type: integer}
            limit_bytes: {type: integer}
            used_bytes: {type: integer}
            enforced: {type: boolean}
            enforcement_method: {type: string}
        network:
          type: object
          required: [rx_bytes, tx_bytes]
          properties:
            rx_bytes: {type: [integer, "null"]}
            tx_bytes: {type: [integer, "null"]}
    NodeResourceSummary:
      type: object
      additionalProperties: false
      required: [node_uuid, sampled_at, cpu, memory, disk, instances]
      properties:
        node_uuid: {type: string}
        sampled_at: {type: string, format: date-time}
        cpu:
          type: object
          additionalProperties: false
          required: [total_cores, allocated_cores, host_usage_percent, managed_usage_cores]
          properties:
            total_cores: {type: integer, minimum: 1}
            allocated_cores: {type: number, minimum: 0}
            host_usage_percent: {type: number, minimum: 0, maximum: 100}
            managed_usage_cores: {type: [number, "null"], minimum: 0}
        memory:
          type: object
          additionalProperties: false
          required: [total_bytes, allocation_limit_bytes, reserved_bytes, allocated_bytes, host_used_bytes, managed_used_bytes, available_bytes]
          properties:
            total_bytes: {type: integer, minimum: 0}
            allocation_limit_bytes: {type: integer, minimum: 0}
            reserved_bytes: {type: integer, minimum: 0}
            allocated_bytes: {type: integer, minimum: 0}
            host_used_bytes: {type: integer, minimum: 0}
            managed_used_bytes: {type: [integer, "null"], minimum: 0}
            available_bytes: {type: integer, minimum: 0}
        disk:
          type: object
          additionalProperties: false
          required: [total_bytes, allocation_limit_bytes, reserved_bytes, allocated_bytes, host_used_bytes, managed_used_bytes, available_bytes]
          properties:
            total_bytes: {type: integer, minimum: 0}
            allocation_limit_bytes: {type: integer, minimum: 0}
            reserved_bytes: {type: integer, minimum: 0}
            allocated_bytes: {type: integer, minimum: 0}
            host_used_bytes: {type: integer, minimum: 0}
            managed_used_bytes: {type: [integer, "null"], minimum: 0}
            available_bytes: {type: integer, minimum: 0}
        instances:
          type: object
          additionalProperties: false
          required: [total, creating, booting, running, stopped, failed, quarantined, deleting]
          properties:
            total: {type: integer, minimum: 0}
            creating: {type: integer, minimum: 0}
            booting: {type: integer, minimum: 0}
            running: {type: integer, minimum: 0}
            stopped: {type: integer, minimum: 0}
            failed: {type: integer, minimum: 0}
            quarantined: {type: integer, minimum: 0}
            deleting: {type: integer, minimum: 0}
    PullImageResponse:
      type: object
      required: [protocol, image, pulled]
      properties:
        protocol: {$ref: "#/components/schemas/Protocol"}
        image: {type: string}
        pulled: {type: boolean}
  responses:
    ApiError:
      description: Request rejection or server-side failure. Internal details are logged under error_id and are never returned to clients.
      headers:
        X-Error-Id:
          description: Opaque support identifier included for server-side failures.
          schema: {type: string, format: uuid}
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing, invalid, or insufficient bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
paths:
  /api/system:
    get:
      summary: Get daemon runtime/configuration summary.
      x-required-scope: system:read
      responses:
        default:
          $ref: "#/components/responses/ApiError"
        "200":
          description: System status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/system/config:
    patch:
      summary: Merge a validated config patch into the daemon config file.
      description: Writes config.yml and returns restart_required=true. Refuses uuid, token_id, and token edits. The allocation.prevent_cpu_overallocation, allocation.prevent_memory_overallocation, and allocation.prevent_disk_overallocation booleans may be changed independently; all default to true.
      x-required-scope: config:admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        default:
          $ref: "#/components/responses/ApiError"
        "200":
          description: Config patch applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigPatchResponse"
  /api/heartbeat:
    get:
      summary: Lightweight authenticated API liveness check.
      description: Returns success when the authenticated management API is reachable, independently of database instance and gateway readiness.
      x-required-scope: system:read
      responses:
        default:
          $ref: "#/components/responses/ApiError"
        "200":
          description: Heartbeat response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeartbeatResponse"
  /metrics:
    get:
      summary: Get Prometheus metrics for the daemon.
      x-required-scope: metrics:read
      responses:
        default:
          $ref: "#/components/responses/ApiError"
        "200":
          description: Prometheus text exposition.
          content:
            text/plain:
              schema:
                type: string
  /api/instances:
    get:
      summary: List database instances with their live classified container statuses.
      x-required-scope: instances:read
      responses:
        default:
          $ref: "#/components/responses/ApiError"
        "200":
          description: Instance list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Instance"
    post:
      summary: Create a database instance.
      x-required-scope: instances:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInstanceRequest"
      responses:
        default:
          $ref: "#/components/responses/ApiError"
        "202":
          description: Instance creation accepted and continuing in the background.
          headers:
            Location:
              description: Origin-relative instance creation status URL.
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateInstanceAcceptedResponse"
        "409":
          description: Instance ID already exists.
        "503":
          description: Creation admission is closed or the bounded creation queue is full.
  /api/instances/{instance_id}:
    parameters:
      - name: instance_id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get one instance with its live classified container status.
      x-required-scope: instances:read
      responses:
        default:
          $ref: "#/components/responses/ApiError"
        "200":
          description: Instance metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Irreversibly delete one instance, its managed container, jobs, artifacts, backups, recovery volumes, and all managed data.
      x-required-scope: instances:write
      parameters:
        - name: confirm
          in: query
          required: true
          description: Must be true because instance deletion always purges managed data.
          schema:
            type: boolean
            const: true
        - name: reason
          in: query
          required: true
          description: Audit reason for irreversible instance deletion; at most 512 characters.
          schema:
            type: string
            minLength: 1
            maxLength: 512
      responses:
        default:
          $ref: "#/components/responses/ApiError"
        "200":
          description: Delete result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteInstanceResponse"
  /api/instances/{instance_id}/status:
    get:
      summary: Get instance status.
      x-required-scope: instances:read
      parameters:
        - name: instance_id
          in: path
          required: true
          schema:
            type: string
      responses:
        default:
          $ref: "#/components/responses/ApiError"
        "200":
          description: Status response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceStatusResponse"
  /api/instances/{instance_id}/limits:
    patch:
      summary: Update CPU, memory, and disk limits for an instance.
      x-required-scope: instances:write
      parameters:
        - name: instance_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LimitsRequest"
      responses:
        default:
          $ref: "#/components/responses/ApiError"
        "200":
          description: Updated instance metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instance"
        "503":
          description: An enabled CPU, memory, or disk allocation guard rejected a limit increase. Limit decreases remain allowed.
  /api/instances/{instance_id}/password:
    patch:
      summary: Reset an instance tenant password or API key.
      description: Atomically rotates the database credential, recreates the managed container with its current image and existing data, validates the replacement credential, and attempts to restore the previous credential if any step fails. The instance must be running and experiences a brief connection interruption.
      x-required-scope: instances:write
      parameters:
        - name: instance_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetInstancePasswordRequest"
      responses:
        default:
          $ref: "#/components/responses/ApiError"
        "200":
          description: Credential reset result. The password is never included.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetInstancePasswordResponse"
  /api/instances/{instance_id}/reconcile:
    post:
      summary: Reconcile stored instance status with the container runtime.
      x-required-scope: instances:write
      parameters:
        - name: instance_id
          in: path
          required: true
          schema:
            type: string
      responses:
        default:
          $ref: "#/components/responses/ApiError"
        "200":
          description: Reconciled instance status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceStatusResponse"
  /api/instances/{instance_id}/power:
    post:
      summary: Unified power API for start, stop, restart, and kill.
      x-required-scope: instances:write
      parameters:
        - name: instance_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PowerRequest"
      responses:
        default:
          $ref: "#/components/responses/ApiError"
        "200":
          description: Power action result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PowerResponse"
  /api/instances/{instance_id}/image:
    patch:
      summary: Pull and switch an instance to a new database image.
      description: Same-major updates recreate the container on the existing volume. Major version changes require major_upgrade=true and run the safer export/import migration workflow where supported.
      x-required-scope: instances:write
      parameters:
        - name: instance_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateInstanceImageRequest"
      responses:
        default:
          $ref: "#/components/responses/ApiError"
        "200":
          description: Image update result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateInstanceImageResponse"
  /api/admin/resources:
    get:
      summary: List resource usage for all instances.
      x-required-scope: resources:admin
      responses:
        default:
          $ref: "#/components/responses/ApiError"
        "200":
          description: Resource reports.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResourceReport"
  /api/admin/resources/summary:
    get:
      summary: Get node capacity, allocation, and whole-host resource pressure.
      description: Allocation includes all managed instances, including stopped instances that may be restarted. Host usage covers the entire Linux node. Managed usage is null when any running or booting instance could not be sampled. Disk totals describe the filesystem backing paths.volumes.
      x-required-scope: resources:admin
      responses:
        default:
          $ref: "#/components/responses/ApiError"
        "200":
          description: Node-wide resource summary for scheduling and capacity decisions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NodeResourceSummary"
  /api/instances/{instance_id}/resources:
    get:
      summary: Get resource usage for one instance.
      x-required-scope: resources:read
      parameters:
        - name: instance_id
          in: path
          required: true
          schema:
            type: string
      responses:
        default:
          $ref: "#/components/responses/ApiError"
        "200":
          description: Resource report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceReport"
  /api/instances/{instance_id}/logs:
    get:
      summary: Get recent logs for one instance.
      x-required-scope: logs:read
      parameters:
        - name: instance_id
          in: path
          required: true
          schema:
            type: string
        - name: tail
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 2000
            default: 200
      responses:
        default:
          $ref: "#/components/responses/ApiError"
        "200":
          description: Log output.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogsResponse"
  /api/instances/{instance_id}/export:
    post:
      summary: Export one instance to a protocol-native dump artifact.
      x-required-scope: import-export:write
      parameters:
        - name: instance_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportRequest"
      responses:
        default:
          $ref: "#/components/responses/ApiError"
        "202":
          description: Queued export job.
          headers:
            Location:
              description: Origin-relative job status URL.
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportExportJob"
  /api/instances/{instance_id}/import:
    post:
      summary: Import a protocol-native artifact or a remote database into one instance.
      x-required-scope: import-export:write
      parameters:
        - name: instance_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportRequest"
      responses:
        default:
          $ref: "#/components/responses/ApiError"
        "202":
          description: Queued import job.
          headers:
            Location:
              description: Origin-relative job status URL.
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportExportJob"
  /api/instances/{instance_id}/import-export/jobs:
    get:
      summary: List import/export jobs for one instance.
      x-required-scope: import-export:read
      parameters:
        - name: instance_id
          in: path
          required: true
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        default:
          $ref: "#/components/responses/ApiError"
        "200":
          description: Job list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ImportExportJob"
  /api/instances/{instance_id}/import-export/jobs/{job_id}:
    get:
      summary: Get one import/export job belonging to an instance.
      x-required-scope: import-export:read
      parameters:
        - name: instance_id
          in: path
          required: true
          schema:
            type: string
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        default:
          $ref: "#/components/responses/ApiError"
        "200":
          description: Job.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportExportJob"
  /api/instances/{instance_id}/backups:
    get:
      summary: List backups belonging to one instance.
      x-required-scope: backups:read
      parameters:
        - name: instance_id
          in: path
          required: true
          schema:
            type: string
      responses:
        default:
          $ref: "#/components/responses/ApiError"
        "200":
          description: Backup artifact list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StoredArtifact"
    post:
      summary: Run a backup for one instance.
      x-required-scope: backups:write
      parameters:
        - name: instance_id
          in: path
          required: true
          schema:
            type: string
      responses:
        default:
          $ref: "#/components/responses/ApiError"
        "200":
          description: Completed backup artifact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoredArtifact"
  /api/admin/backups/status:
    get:
      summary: Get automatic backup configuration status.
      x-required-scope: backups:admin
      responses:
        default:
          $ref: "#/components/responses/ApiError"
        "200":
          description: Backup status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupStatusResponse"
  /api/admin/backups/run:
    post:
      summary: Run backups for all eligible instances.
      x-required-scope: backups:admin
      responses:
        default:
          $ref: "#/components/responses/ApiError"
        "200":
          description: Completed backups and skipped instances.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunBackupsResponse"
  /api/instances/{instance_id}/backups/{backup_id}:
    delete:
      summary: Delete one backup belonging to an instance.
      x-required-scope: backups:write
      parameters:
        - name: instance_id
          in: path
          required: true
          schema:
            type: string
        - name: backup_id
          in: path
          required: true
          schema:
            type: string
      responses:
        default:
          $ref: "#/components/responses/ApiError"
        "200":
          description: Delete result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteArtifactResponse"
  /api/instances/{instance_id}/backups/{backup_id}/contents:
    get:
      summary: Browse the bounded schema catalog and captured row previews stored with a backup.
      description: Existing backups created before catalog capture return catalog_available=false. The endpoint never starts a restored database or executes queries against backup files.
      x-required-scope: backups:read
      parameters:
        - name: instance_id
          in: path
          required: true
          schema:
            type: string
        - name: backup_id
          in: path
          required: true
          schema:
            type: string
        - name: object
          in: query
          required: false
          description: Exact object id returned by the objects list, such as public.users.
          schema:
            type: string
            maxLength: 1024
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        default:
          $ref: "#/components/responses/ApiError"
        "200":
          description: Backup catalog, with an optional bounded preview selection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupContentsResponse"
  /api/instances/{instance_id}/backups/{backup_id}/download:
    parameters:
      - name: instance_id
        in: path
        required: true
        schema:
          type: string
      - name: backup_id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Download a backup using its temporary URL.
      description: The stream is admitted under node-wide and transport-peer concurrency caps. A 429 response does not consume a single-use ticket.
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        default:
          $ref: "#/components/responses/ApiError"
        "200":
          description: Backup file stream.
    post:
      summary: Create a temporary download URL for one instance backup.
      x-required-scope: backups:read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDownloadRequest"
      responses:
        default:
          $ref: "#/components/responses/ApiError"
        "200":
          description: Temporary download URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadUrlResponse"
  /api/instances/{instance_id}/backups/{backup_id}/restore:
    post:
      summary: Restore one backup into the same instance that owns it.
      x-required-scope: recovery:admin
      parameters:
        - name: instance_id
          in: path
          required: true
          schema:
            type: string
        - name: backup_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DestructiveActionConfirmation"
      responses:
        default:
          $ref: "#/components/responses/ApiError"
        "200":
          description: Completed restore result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RestoreBackupResponse"
  /api/instances/{instance_id}/artifacts:
    get:
      summary: List export artifacts belonging to one instance.
      x-required-scope: artifacts:read
      parameters:
        - name: instance_id
          in: path
          required: true
          schema:
            type: string
      responses:
        default:
          $ref: "#/components/responses/ApiError"
        "200":
          description: Artifact list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StoredArtifact"
  /api/instances/{instance_id}/artifacts/{artifact_id}:
    delete:
      summary: Delete one export artifact belonging to an instance.
      x-required-scope: artifacts:write
      parameters:
        - name: instance_id
          in: path
          required: true
          schema:
            type: string
        - name: artifact_id
          in: path
          required: true
          schema:
            type: string
      responses:
        default:
          $ref: "#/components/responses/ApiError"
        "200":
          description: Delete result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteArtifactResponse"
  /api/instances/{instance_id}/artifacts/{artifact_id}/download:
    parameters:
      - name: instance_id
        in: path
        required: true
        schema:
          type: string
      - name: artifact_id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Download an artifact using its temporary URL.
      description: The stream is admitted under node-wide and transport-peer concurrency caps. A 429 response does not consume a single-use ticket.
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        default:
          $ref: "#/components/responses/ApiError"
        "200":
          description: Artifact file stream.
    post:
      summary: Create a temporary download URL for one instance artifact.
      x-required-scope: artifacts:read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDownloadRequest"
      responses:
        default:
          $ref: "#/components/responses/ApiError"
        "200":
          description: Temporary download URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadUrlResponse"
  /api/instances/{instance_id}/artifacts/retention:
    post:
      summary: Apply artifact retention for one instance.
      x-required-scope: artifacts:write
      parameters:
        - name: instance_id
          in: path
          required: true
          schema:
            type: string
      responses:
        default:
          $ref: "#/components/responses/ApiError"
        "200":
          description: Deleted artifact IDs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetentionResponse"
  /api/admin/recovery/failed-jobs:
    get:
      summary: List failed import/export jobs across the node.
      x-required-scope: recovery:admin
      responses:
        default:
          $ref: "#/components/responses/ApiError"
        "200":
          description: Failed job list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ImportExportJob"
  /api/instances/{instance_id}/recovery/jobs/{job_id}/retry:
    post:
      summary: Retry a failed export or artifact import from its sanitized replay options. Credential imports and legacy jobs must be resubmitted.
      x-required-scope: recovery:admin
      parameters:
        - name: instance_id
          in: path
          required: true
          schema:
            type: string
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        default:
          $ref: "#/components/responses/ApiError"
        "202":
          description: Replacement job.
          headers:
            Location:
              description: Origin-relative replacement job status URL.
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportExportJob"
  /api/instances/{instance_id}/recovery/restore:
    post:
      summary: Restore an export artifact belonging to the same instance.
      x-required-scope: recovery:admin
      parameters:
        - name: instance_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [artifact_id, confirm, reason]
              properties:
                artifact_id:
                  type: string
                confirm:
                  type: boolean
                reason:
                  type: string
                  minLength: 1
                  maxLength: 512
      responses:
        default:
          $ref: "#/components/responses/ApiError"
        "202":
          description: Queued restore job.
          headers:
            Location:
              description: Origin-relative restore job status URL.
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportExportJob"
  /api/ws-token:
    post:
      summary: Issue short-lived WebSocket JWT for monitoring/log streams.
      x-required-scope: ws-tokens:write
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WsTokenRequest"
      responses:
        default:
          $ref: "#/components/responses/ApiError"
        "200":
          description: WebSocket token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WsTokenResponse"
  /api/admin/images/pull:
    post:
      summary: Pull an image for a protocol.
      x-required-scope: images:admin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [protocol]
              properties:
                protocol:
                  $ref: "#/components/schemas/Protocol"
                image:
                  type: [string, "null"]
      responses:
        default:
          $ref: "#/components/responses/ApiError"
        "200":
          description: Pull result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PullImageResponse"
  /ws/monitoring:
    get:
      summary: WebSocket stream of instance resource snapshots.
      description: >-
        Requires a short-lived WebSocket JWT with monitor:read. Non-browser clients may send Authorization: Bearer <jwt>. Browser clients should use Sec-WebSocket-Protocol with ["dbe.jwt", "<jwt>"]. Query-string tokens are rejected. Messages and frames are limited to 16 KiB. Full snapshots are emitted every 500 ms and include current instance stats plus install_progress entries for create, image-update, and major-upgrade operations. Each instance includes configured limits plus live usage fields: cpu_usage_percent, memory_usage_bytes, memory_limit_bytes, disk_used_bytes, network_rx_bytes, network_tx_bytes, and a resources object matching GET /api/instances/{instance_id}/resources. Network RX/TX are cumulative bytes observed at the authenticated gateway-to-backend boundary since daemon boot.
      x-required-scope: monitor:read
      x-websocket: true
      responses:
        default:
          $ref: "#/components/responses/ApiError"
        "101":
          description: WebSocket upgrade.
  /ws/instances/{instance_id}/logs:
    get:
      summary: WebSocket stream of container logs for one instance.
      description: >-
        Requires a short-lived WebSocket JWT with logs:read. Non-browser clients may send Authorization: Bearer <jwt>. Browser clients should use Sec-WebSocket-Protocol with ["dbe.jwt", "<jwt>"]. Query-string tokens are rejected. Messages and frames are limited to 16 KiB.
      x-required-scope: logs:read
      x-websocket: true
      parameters:
        - name: instance_id
          in: path
          required: true
          schema:
            type: string
      responses:
        default:
          $ref: "#/components/responses/ApiError"
        "101":
          description: WebSocket upgrade.
  /ws/instances/{instance_id}/import-export:
    get:
      summary: WebSocket stream of import/export jobs for one instance.
      description: Requires a short-lived WebSocket JWT with import-export:read and access to the instance in the path. Messages and frames are limited to 16 KiB.
      x-required-scope: import-export:read
      x-websocket: true
      parameters:
        - name: instance_id
          in: path
          required: true
          schema:
            type: string
        - name: job_id
          in: query
          required: false
          schema:
            type: string
      responses:
        default:
          $ref: "#/components/responses/ApiError"
        "101":
          description: WebSocket upgrade.

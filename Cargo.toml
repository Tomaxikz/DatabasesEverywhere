[package]
name = "databases-everywhere"
version = "0.5.1"
edition = "2024"

[[bin]]
name = "dbev"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.103"
aws-lc-rs = "1.17.1"
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
base64 = "0.22"
bzip2 = { version = "0.4", features = ["static"] }
bollard = "0.21.0"
bson = "2.13"
bytes = "1.6"
clap = { version = "4.5", features = ["derive", "env"] }
futures = "0.3"
h2 = "0.4"
hdrhistogram = "7.5"
http = "1.1"
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
jsonwebtoken = { version = "10.3.0", default-features = false, features = ["aws_lc_rs"] }
notify = { version = "8.2.0", default-features = false }
secrecy = { version = "0.10", features = ["serde"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
rustls-pki-types = { version = "1.14", features = ["std"] }
rustix = { version = "1.1", features = ["fs", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots-no-provider", "json", "multipart", "stream"] }
sha1 = "0.10"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
subtle = "2.6"
flate2 = "1.0"
tar = "0.4"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1.38", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = "0.26"
tokio-util = { version = "0.7", features = ["io", "io-util"] }
tower-http = { version = "0.6", features = ["cors", "timeout", "trace"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.10", features = ["serde", "v4"] }
webpki-roots = "1.0"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
zstd = "0.13"

[build-dependencies]
sha2 = "0.10"
zstd = "0.13"

[dev-dependencies]
tempfile = "3.10"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1

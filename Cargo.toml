[package]
name = "databases-everywhere"
version = "1.0.0"
edition = "2024"

[workspace]
members = ["tools/helper-packer", "tools/release-builder"]
resolver = "3"

[lib]
path = "src/app/mod.rs"

[[bin]]
name = "dbev"
path = "src/main.rs"

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
anyhow = "1.0.104"
aws-credential-types = { version = "1.3.1", default-features = false }
aws-sigv4 = { version = "1.6.6", default-features = false, features = ["sign-http", "http1"] }
aws-lc-rs = "1.19.0"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "tracing", "ws"] }
axum-server = { version = "0.9.2", features = ["tls-rustls"] }
base64 = "0.23.1"
bzip2 = { version = "0.6.1", features = ["static"] }
bollard = { version = "0.21.1", default-features = false, features = ["pipe"] }
bson = "3.1.0"
bytes = "1.12.2"
clap = { version = "4.6.9", features = ["derive", "env"] }
crc = "3.4.0"
csv = "1.4.0"
form_urlencoded = "1.2.2"
futures = "0.3.34"
h2 = "0.4.20"
hex = "0.4.3"
hdrhistogram = { version = "7.6.0", default-features = false }
http = "1.5.0"
httparse = "1.10.1"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
jsonwebtoken = { version = "12.0.0", default-features = false, features = ["aws_lc_rs"] }
libc = "0.2.191"
notify = { version = "8.2.2", default-features = false }
secrecy = { version = "0.10.3", features = ["serde"] }
percent-encoding = "2.3.2"
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs"] }
rustls-pki-types = { version = "1.16.0", features = ["std"] }
rustix = { version = "1.1.6", features = ["fs", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
yaml_serde = "0.10.7"
serde_ignored = "0.1.14"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "json", "multipart", "stream"] }
sha1 = "0.11.0"
sha2 = "0.11.1"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
subtle = "2.6.1"
flate2 = "1.1.11"
tempfile = "3.27.0"
tar = { version = "0.4.46", default-features = false }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["formatting", "macros", "parsing"] }
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs", "tls12"] }
tokio-util = { version = "0.7.20", features = ["io", "io-util", "rt"] }
tower-http = { version = "0.7.1", features = ["cors", "timeout", "trace"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.3", features = ["v4"] }
walkdir = "2.5.0"
webpki-root-certs = "1.0.12"
webpki-roots = "1.0.12"
zip = { version = "9.8.1", default-features = false, features = ["deflate-flate2"] }
zstd = { version = "0.14.4", default-features = false }
governor = "0.10.4"
procfs = { version = "0.18.0", default-features = false }
backon = "1.6.0"
quick-xml = { version = "0.42.0", features = ["serialize", "overlapped-lists"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
utoipa = { version = "6.0.0", features = ["preserve_order", "preserve_path_order", "uuid", "yaml"] }
parking_lot = "0.12.5"

[build-dependencies]
sha2 = "0.11.1"
zstd = { version = "0.14.4", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
linux-raw-sys = { version = "0.12.1", features = ["btrfs", "ioctl"] }

[dev-dependencies]
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
criterion = { version = "0.8.2", default-features = false, features = ["async_tokio", "cargo_bench_support"] }
tokio = { version = "1.54.1", features = ["test-util"] }
tower = { version = "0.5.3", features = ["util"] }

[[bench]]
name = "route_lookup"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Optimized but quick to rebuild, for running dbev on your own machine:
# `cargo local`, binary at target/local/dbev. Published builds use release.
[profile.local]
inherits = "release"
lto = false
codegen-units = 16
incremental = true

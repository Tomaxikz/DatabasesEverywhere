[package]
name = "dbev-tether"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
name = "tether"

[dependencies]
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"] }
rustls = { workspace = true, features = ["std"] }
rustls-pki-types = { workspace = true }
# Reads the subject-alternative-name entries of a peer certificate; webpki's name iterator
# skips entries it cannot interpret, so it cannot prove a certificate names exactly one node.
x509-parser = { version = "0.18.1", default-features = false }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tracing = { workspace = true }

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
tokio = { workspace = true, features = ["rt-multi-thread"] }

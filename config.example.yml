debug: false
uuid: dbe-node-generated-by-panel
token_id: dbe-token-id-generated-by-panel
token: REPLACE_WITH_32_BYTE_RANDOM_API_TOKEN
jwt_signing_key: REPLACE_WITH_32_BYTE_RANDOM_JWT_SIGNING_KEY
remote: https://playground.cleaveroute.com

tls:
  cert: /etc/nginx/ssl/cf/origin.pem
  key: /etc/nginx/ssl/cf/key.pem

postgres:
  enabled: true
  bind: 127.0.0.1:5434
  tls: false

mariadb:
  enabled: true
  bind: 127.0.0.1:3307
  tls: false

mysql:
  enabled: true
  bind: 127.0.0.1:3308
  tls: false

redis:
  enabled: true
  bind: 127.0.0.1:6380
  tls: false

valkey:
  enabled: true
  bind: 127.0.0.1:6381
  tls: false

mongodb:
  enabled: true
  bind: 127.0.0.1:27018
  tls: false

clickhouse:
  # Native TCP and HTTP are separate public gateways.
  enabled: true
  bind: 127.0.0.1:9000
  http_bind: 127.0.0.1:8123
  tls: false

qdrant:
  enabled: true
  bind: 127.0.0.1:6334
  tls: false

api:
  # HTTP and HTTPS are both supported, matching Wings. Prefer native TLS or a
  # trusted TLS reverse proxy outside isolated development/private networks.
  host: 127.0.0.1
  port: 8090
  # Canonical public DNS hostname only: no scheme, port, path, or wildcard.
  # It is automatically accepted in the HTTP Host header. Leave empty for a
  # loopback-only deployment; public nodes should set the hostname from their
  # panel API URL (for example, db-node.example.com).
  fqdn: ''
  # Additional browser origins allowed to call DBEV through CORS and WebSocket
  # upgrades. These are exact HTTP(S) origins: scheme, hostname, and effective
  # port must all match. The primary `remote` panel origin is always included.
  trusted_origins: []
  ssl:
    enabled: false
    cert: ''
    key: ''
    require_client_cert: false
    client_ca: ''

security:
  api_body_limit_bytes: 1048576
  # Per authenticated credential + transport peer IPv4 (or IPv6 /64).
  api_rate_limit_per_minute: 600
  db_connection_limit_per_minute: 240
  # API self-upgrade is intentionally unsupported; use signed packages or a
  # digest-pinned container rollout. Validation rejects true.
  self_upgrade_enabled: false
  pids_limit: 512
  pids_limits:
    # Optional per-protocol overrides. ClickHouse needs more process/thread
    # headroom during startup than the lighter database images.
    clickhouse: 4096
    mysql: null
    valkey: null
    qdrant: null
  remote_import:
    enabled: true
    # Plaintext source credentials are rejected unless this is explicitly
    # enabled. TLS remains the default on every remote import request.
    allow_plaintext: false
    # Public addresses are accepted by default. A private RFC1918, ULA, or
    # carrier-grade NAT address is accepted only when its exact requested host
    # name or IP is listed here. Loopback, link-local, metadata, multicast,
    # documentation, and reserved ranges are always rejected.
    allowed_private_hosts: []
    max_concurrent_jobs: 4
    connect_timeout_seconds: 15
    # Upper bound for an acquisition or target-operation phase. Redis, Valkey, and
    # Qdrant additionally reserve part of one such window for rollback.
    operation_timeout_seconds: 900
    max_staged_bytes: 8589934592

artifacts:
  retention_keep_latest: 20
  retention_max_age_days: 30
  # False retains generated exports in the artifact inventory. True keeps only
  # a private one-use spool until download, disconnect, or expiry.
  stream_exports_only: false
  # Hard per-database cap for retained artifacts or pending one-use exports.
  max_artifacts_per_instance: 20
  # Temporary user-provided dumps are separate from DBEV-generated artifacts.
  # Declared Content-Length is reserved before the stream is accepted.
  import_upload_max_bytes: 8589934592
  import_upload_max_total_bytes: 34359738368
  import_upload_max_per_instance: 4
  # Additional simultaneous uploads fail fast so request bodies are not read.
  import_upload_max_concurrent: 2
  # Ready or failed uploads are swept unless imported or cancelled sooner.
  import_upload_ttl_hours: 24
  # Total-transfer and per-body-idle deadlines; neither changes ordinary API limits.
  import_upload_timeout_seconds: 3600
  import_upload_idle_timeout_seconds: 30
  import_export_scheduler:
    # Dynamic mode admits a large durable queue but starts work only when its
    # estimated CPU, streaming-memory, and I/O budgets fit. A zero model
    # recommendation means live memory cannot safely fit one job and must not
    # be forced to one. CPU/I/O-only oversize runs alone. Set false to use
    # manual_max_active_jobs as a fixed execution ceiling.
    dynamic_limiter_enabled: true
    max_queued_jobs: 1024
    max_queued_jobs_per_instance: 32
    manual_max_active_jobs: 16
    dynamic_max_active_jobs: 256
    # Zero refreshes effective host/cgroup memory and CPU headroom while the
    # daemon runs; I/O capacity is derived from upload limits.
    dynamic_memory_budget_mib: 0
    dynamic_io_budget_mib: 0
    dynamic_cpu_units: 0
    # Also bounds how long a job may wait for auto-detected headroom to recover.
    starvation_timeout_seconds: 30
    max_bypass: 8
backups:
  enabled: false
  interval_minutes: 1440
  run_on_startup: false
  retention_keep_latest_per_instance: 7
  retention_max_age_days: 30
  storage:
    # local keeps backwards-compatible archives under paths.backups. Choose
    # exactly one of local, s3, or kopia for this daemon. Changing drivers does
    # not migrate or combine existing backup inventories. Remote drivers still
    # stage one complete archive below paths.backups and restore via paths.tmp.
    driver: local
    s3:
      bucket: ""
      region: us-east-1
      # Leave empty for AWS S3. S3-compatible endpoints must be full HTTP(S)
      # URLs; HTTP additionally requires allow_http: true.
      endpoint: ""
      prefix: dbev
      # Empty credentials fall back to AWS_ACCESS_KEY_ID,
      # AWS_SECRET_ACCESS_KEY, and optional AWS_SESSION_TOKEN.
      access_key_id: ""
      secret_access_key: ""
      session_token: ""
      path_style: false
      allow_http: false
      request_timeout_seconds: 900
      max_retries: 3
    kopia:
      executable: /usr/local/bin/kopia
      # Empty uses paths.backups/.kopia/repository.config.
      config_file: ""
      # Empty lets Kopia use its normal password sources.
      repository_password: ""
      operation_timeout_seconds: 3600
  browsing:
    enabled: true
    max_objects: 256
    max_preview_objects: 32
    preview_rows_per_object: 10
    max_row_bytes: 4096
    max_catalog_bytes: 1048576

# Node-wide admission guards. Keep these enabled in production. They may be
# disabled independently for deliberate test-node overcommit. Null maxima use
# detected host capacity minus the reserve; explicit maxima make a smaller pool.
allocation:
  prevent_cpu_overallocation: true
  prevent_memory_overallocation: true
  prevent_disk_overallocation: true
  max_memory_mib: null
  max_disk_mib: null
  reserved_memory_mib: 512
  reserved_disk_mib: 2048

disk:
  # auto prefers native project quotas, then FuseQuota. Qdrant uses the soft
  # scanner whenever native quotas are unavailable because FUSE is unsafe for
  # its persistent storage. Other choices: project_quota, fuse_quota,
  # soft_scanner (`none` remains an alias for soft_scanner).
  mode: auto
  # DBE detects native XFS, Btrfs, ZFS, ext4, or f2fs quota support from the
  # filesystem backing paths.volumes. It falls back to FuseQuota automatically.
  # Native quota modes allocate at most 1,000,000 consecutive IDs from this
  # base. Reserve that range exclusively for DBE on the host.
  project_id_base: 200000
  # `embedded` is hash-verified automatically. For a custom helper, use an
  # absolute path in root-owned, non-writable directories and set its SHA-256.
  fuse_quota_binary: embedded
  fuse_quota_binary_sha256: ""
  fuse_quota_rescan_interval_seconds: 150
  soft_scanner:
    scan_interval_seconds: 15
    # Use inotify to rescan only changed subtrees between authoritative full
    # scans. Event loss, overflow, watch failure, or cache uncertainty always
    # falls back to a full scan.
    use_inotify: true
    full_scan_interval_seconds: 90
    inotify_debounce_milliseconds: 500
    max_dirty_paths_per_instance: 512
    max_concurrent_scans: 2
    max_entries_per_scan: 1000000
    scan_timeout_seconds: 30
    max_consecutive_scan_failures: 3
    safety_reserve_mib: 64
    recovery_percent: 85
    shutdown_grace_seconds: 30

daemon:
  # docker or podman. Both use the Docker-compatible container API.
  engine: docker
  # Optional. Docker uses its normal local socket when empty. A root-run Podman
  # daemon uses /run/podman/podman.sock when this is empty.
  # For a rootless service managed by dbev --setup, configure the exact
  # standard path explicitly, for example /run/user/1000/podman/podman.sock.
  socket_path: ""
  # Database containers always use network_mode=none. The daemon reaches
  # each backend through its private, instance-specific Unix socket.
  # Optional container HostConfig hardening knobs. Podman automatically gets
  # label=disable unless an explicit label=... security option is supplied.
  container_read_only_rootfs: false
  container_userns_mode: ''
  container_seccomp_profile: ''
  container_apparmor_profile: ''
  container_security_opts: []

images:
  postgres: "postgres:18.4"
  redis: "redis:8.8.0"
  valkey: "valkey/valkey:9.1.1"
  mariadb: "mariadb:12.3.2"
  mysql: "mysql:8.4"
  # MongoDB 8.x is not compatible with Linux kernel 6.19+ / 7.x at the time
  # of writing due to SERVER-121912. If MongoDB fails to start with that
  # kernel warning, switch this to the latest known working 7.x tag:
  # "mongo:7.0.37"
  # https://www.mongodb.com/docs/v8.2/release-notes/8.0/#mongodb-8-0-incompatible-with-kernel-6-19
  # https://jira.mongodb.org/browse/SERVER-121912
  mongodb: "mongo:8.3.4"
  clickhouse: "clickhouse/clickhouse-server:26.4.4.38"
  qdrant: "qdrant/qdrant:v1.18.2"
  # Optional per-protocol update allowlist. The configured image above is always
  # allowed even if it is not repeated here.
  allowed:
    postgres:
      - "postgres:18.4"
    redis:
      - "redis:8.8.0"
    valkey:
      - "valkey/valkey:9.1.1"
    mariadb:
      - "mariadb:12.3.2"
    mysql:
      - "mysql:8.4"
      # Supported upgrade targets; keep only images your operators reviewed.
      - "mysql:9.7"
      - "mysql:26.7"
    mongodb:
      - "mongo:8.3.4"
      - "mongo:7.0.37"
    clickhouse:
      - "clickhouse/clickhouse-server:26.4.4.38"
    qdrant:
      - "qdrant/qdrant:v1.18.2"

paths:
  data: /var/lib/dbev
  metadata: /var/lib/dbev/metadata
  volumes: /var/lib/dbev/volumes
  backups: /var/lib/dbev/backups
  sockets: /run/dbev/sockets
  locks: /run/dbev/locks
  logs: /var/lib/dbev/logs
  artifacts: /var/lib/dbev/artifacts
  exports: /var/lib/dbev/artifacts/exports
  imports: /var/lib/dbev/artifacts/imports
  fuse: /var/lib/dbev/fuse
  tmp: /var/lib/dbev/tmp

  /ws/monitoring:
    get:
      summary: WebSocket stream of instance resource snapshots.
      description: >-
        Requires monitor:read on a short-lived generation-bound WebSocket JWT. Browser authentication uses Sec-WebSocket-Protocol ["dbe.jwt", "<jwt>"]; query tokens are rejected.
        One full authorized instance snapshot is produced per second, split into bounded messages with sequence, sampled_at_unix, batch_index and batch_count. Assemble every batch before applying a sequence. Reconnect with a fresh JWT on a missing/incomplete sequence; skipping progress deltas loses updates.
        API 0.16 instance identity lives only on the outer item: instance_id, runtime_id, deployment_mode, resource_scope, protocol, status, runtime.
        resources contains only cpu, memory and disk (or null with resource_error); REST resource responses remain self-contained. activity omits instance_id and is the only WebSocket location for rx_bytes and tx_bytes.
        install_progress contains changed records only. After assembling a sequence, clear the progress cache if progress_reset is true, remove install_progress_removed IDs, and upsert install_progress by instance_id. Missing progress is not deletion or a creating state.
        New connections receive a complete retained progress snapshot with progress_reset=true. Reset sequence/batch state on reconnect; keep explicit null values, source labels, timestamps and stats_epoch discontinuities.
        CPU remains percentage points (11.0 means 11%). Shared tenant CPU/RAM remains null, never whole-pool consumption. Sampling, generation checks, authorization and 16-KiB batch limits are unchanged.
      x-websocket-message: {$ref: "#/components/schemas/MonitoringBatch"}
      x-required-scope: monitor:read
      x-websocket: true
      responses:
        default:
          $ref: "#/components/responses/ApiError"
        "101":
          description: WebSocket upgrade.
  /ws/instances/{instance_id}/logs:
    get:
      summary: WebSocket stream of container logs for one instance.
      description: >-
        Requires logs:read on a generation-bound WebSocket JWT. Dedicated instances only; shared logs return 409.
        API 0.16 sends type=logs with event=reset and sequence=0, then event=append with stream=stdout|stderr and data containing new text only. One Docker follow request delivers the requested tail followed by live output.
        Append to a bounded client buffer; never replace it for append events. event=end terminates the stream, optionally with a public error. Sequence numbers are per connection. Reconnect clears local sequence state and receives a new reset/tail, not guaranteed lossless history.
        Complete records are redacted across runtime chunks, then split into UTF-8-safe messages below 16 KiB. An incomplete final secret value is omitted. Records exceeding the 128-KiB redaction budget end the stream with log_record_limit; do not retry that error in a tight loop.
        Heartbeats use Ping/Pong every 30 seconds and never resend log text. Expiry, shutdown and generation fencing remain enforced.
      x-websocket-message: {$ref: "#/components/schemas/LogEvent"}
      x-required-scope: logs:read
      x-websocket: true
      parameters:
        - name: instance_id
          in: path
          required: true
          schema:
            type: string
      responses:
        default:
          $ref: "#/components/responses/ApiError"
        "101":
          description: WebSocket upgrade.
        "409":
          description: Shared-engine logs are pool-wide and cannot be exposed through a tenant-scoped WebSocket.
  /ws/instances/{instance_id}/import-export:
    get:
      summary: WebSocket stream of import/export jobs for one instance.
      description: Requires a short-lived WebSocket JWT with import-export:read and access to the instance in the path. Messages and frames are limited to 16 KiB.
      x-required-scope: import-export:read
      x-websocket: true
      parameters:
        - name: instance_id
          in: path
          required: true
          schema:
            type: string
        - name: job_id
          in: query
          required: false
          schema:
            type: string
      responses:
        default:
          $ref: "#/components/responses/ApiError"
        "101":
          description: WebSocket upgrade.

                - unix_socket
            additionalProperties: false
          - type: object
            required:
            - host
            - port
            - kind
            properties:
              host:
                type: string
              port:
                type: integer
                format: int32
                minimum: 0
              kind:
                type: string
                enum:
                - docker_tcp

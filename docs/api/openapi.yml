                  $ref: "#/components/schemas/BackupInfo"
    post:
      summary: Run a backup for one instance.
      description: Dedicated instances use their protocol's physical backup layout where supported. Shared tenants always use tenant-scoped logical backups and never capture the pool filesystem or another tenant's data.
      x-required-scope: backups:write
      parameters:
        - name: instance_id
          in: path
          required: true
          schema:
            type: string
      responses:
        default:
          $ref: "#/components/responses/ApiError"
        "200":
          description: Completed backup artifact.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupInfo"
  /api/admin/backups/status:
    get:
      summary: Get automatic backup configuration status.
      x-required-scope: backups:admin
      responses:
        default:
          $ref: "#/components/responses/ApiError"
        "200":
          description: Backup status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupStatusResponse"
  /api/admin/backups/run:
    post:
      summary: Run backups for all eligible instances.
      x-required-scope: backups:admin
      responses:
        default:
          $ref: "#/components/responses/ApiError"
        "200":

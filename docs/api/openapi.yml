      parameters:
      - name: instance_id
        in: path
        required: true
        schema:
          type: string
      - name: Content-Length
        in: header
        description: Required for application/octet-stream and must exactly equal the bytes sent.
        required: false
        schema:
          type: integer
          format: int64
          minimum: 1
      - name: X-DBEV-Filename
        in: header
        description: Required for application/octet-stream. Percent-encoded UTF-8 flat filename, at most 180 decoded bytes, with a supported native dump extension. Paths and traversal components are rejected.

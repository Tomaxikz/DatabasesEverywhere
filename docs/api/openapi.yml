# Generated from the code by `DBEV_WRITE_OPENAPI=1 cargo test --test openapi_contract`.
openapi: 3.1.0
info:
  title: DatabasesEverywhere API
  description: API used by panels/addons to create, manage, monitor, back up, and restore hosted database instances.
  version: 0.17.0
servers:
- url: http://127.0.0.1:8090
  description: Local daemon API
paths:
  /api/system:
    get:
      tags:
      - system
      summary: Get daemon runtime/configuration summary.
      operationId: system
      responses:
        '200':
          description: System status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/ApiError'
      x-required-scope: system:read
  /api/system/import-export-scheduler/recommendation:
    get:
      tags:
      - system
      summary: Inspect live import/export scheduling capacity and estimate representative concurrency.
      description: The recommendation is a conservative resource model, not a measured throughput guarantee. A result of zero means the live memory budget cannot safely fit one modelled job and must not be coerced to one. CPU and I/O are concurrency weights; a memory-safe job that exceeds either whole weight budget may run only as one isolated job. A compressed logical import is charged at the configured prepared-data ceiling because its expansion ratio is not trusted before bounded extraction; compressed Redis, Valkey, and Qdrant physical imports are charged at the target disk allocation, capped by the physical archive limit. MongoDB, Redis, Valkey, and Qdrant are always modelled as natively compressed. action=export with mode=wipe is invalid.
      operationId: scheduler_recommendation
      parameters:
      - name: protocol
        in: query
        description: Defaults to postgres when omitted.
        required: false
        schema:
          $ref: '#/components/schemas/Protocol'
      - name: action
        in: query
        required: false
        schema:
          type: string
          enum:
          - import
          - export
      - name: size_bytes
        in: query
        description: Plain or prepared input size. Defaults to the configured maximum upload size.
        required: false
        schema:
          type: integer
          format: int64
          maximum: 68719476736
          minimum: 1
      - name: target_disk_mib
        in: query
        description: Defaults to size_bytes rounded up to MiB.
        required: false
        schema:
          type: integer
          format: int64
          minimum: 1
      - name: mode
        in: query
        required: false
        schema:
          type: string
          enum:
          - merge
          - wipe
      - name: compressed
        in: query
        description: Compression hint. Native-compression protocols are treated as compressed even when false.
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Live scheduler snapshot and model-based recommendation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportExportSchedulerRecommendation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        default:
          $ref: '#/components/responses/ApiError'
      x-required-scope: system:read
  /api/system/config:
    patch:
      tags:
      - system
      summary: Merge a validated config patch into the daemon config file.
      description: Writes config.yml and returns restart_required=true. Refuses identity/token, managed-path, container-image, S3-endpoint, executable-helper, and Fuse helper edits, including replacement or removal of their ancestors. The allocation.prevent_cpu_overallocation, allocation.prevent_memory_overallocation, and allocation.prevent_disk_overallocation booleans may be changed independently; all default to true.
      operationId: patch_config
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
              propertyNames:
                type: string
        required: true
      responses:
        '200':
          description: Config patch applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigPatchResponse'
        default:
          $ref: '#/components/responses/ApiError'
      x-required-scope: config:admin
  /api/heartbeat:
    get:
      tags:
      - system
      summary: Lightweight authenticated API liveness check.
      description: Returns success when the authenticated management API is reachable, independently of database instance and gateway readiness.
      operationId: heartbeat
      responses:
        '200':
          description: Heartbeat response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeartbeatResponse'
        default:
          $ref: '#/components/responses/ApiError'
      x-required-scope: system:read
  /metrics:
    get:
      tags:
      - system
      summary: Get Prometheus metrics for the daemon.
      operationId: metrics
      responses:
        '200':
          description: Prometheus text exposition.
          content:
            text/plain:
              schema:
                type: string
        default:
          $ref: '#/components/responses/ApiError'
      x-required-scope: metrics:read
  /api/ws-token:
    post:
      tags:
      - monitoring
      summary: Issue short-lived WebSocket JWT for monitoring/log streams.
      operationId: issue_ws_token
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WsTokenRequest'
        required: true
      responses:
        '200':
          description: WebSocket token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WsTokenResponse'
        default:
          $ref: '#/components/responses/ApiError'
      x-required-scope: ws-tokens:write
components:
  schemas:
    ConfigPatchResponse:
      type: object
      required:
      - applied
      - restart_required
      - config_path
      properties:
        applied:
          type: boolean
        restart_required:
          type: boolean
        config_path:
          type: string
      additionalProperties: false
    DeploymentCapability:
      type: object
      required:
      - protocol
      - enabled
      - modes
      - shared_pool_scope
      - server_private_pools
      properties:
        protocol:
          $ref: '#/components/schemas/Protocol'
        enabled:
          type: boolean
          description: Whether the protocol listener and provisioning path are enabled on this node.
        modes:
          type: array
          items:
            $ref: '#/components/schemas/DeploymentMode'
          minItems: 1
        shared_pool_scope:
          type:
          - string
          - 'null'
          enum:
          - server
          - null
        server_private_pools:
          type: boolean
      additionalProperties: false
    DeploymentMode:
      type: string
      description: Dedicated owns one engine runtime; shared is an isolated logical tenant in a managed engine pool. Shared is available only for PostgreSQL, MySQL, MariaDB, MongoDB, and ClickHouse. Shared ClickHouse deliberately excludes whole-table DROP/DETACH, FREEZE, partition move/fetch, and table-settings privileges so tenant files cannot escape catalog disk accounting; DBEV retains those operations for its administrator-scoped restore and deletion paths.
      enum:
      - dedicated
      - shared
    Error:
      type: object
      required:
      - error
      - code
      properties:
        error:
          type: string
        code:
          type: string
        error_id:
          type:
          - string
          - 'null'
          format: uuid
          description: Opaque support identifier included only for server-side failures.
      additionalProperties: false
    GatewayReadiness:
      type: object
      required:
      - status
      - expected_listeners
      - ready_listeners
      properties:
        status:
          type: string
          enum:
          - starting
          - ready
          - failed
          - stopping
        expected_listeners:
          type: integer
          minimum: 0
        ready_listeners:
          type: integer
          minimum: 0
        failure:
          type:
          - string
          - 'null'
      additionalProperties: false
    HeartbeatResponse:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - ok
      additionalProperties: false
    ImportExportJobResourceCost:
      type: object
      required:
      - input_size_bytes
      - memory_mib
      - io_mib
      - cpu_units
      properties:
        input_size_bytes:
          type: integer
          format: int64
          minimum: 1
        memory_mib:
          type: integer
          format: int64
          minimum: 1
        io_mib:
          type: integer
          format: int64
          minimum: 1
        cpu_units:
          type: integer
          minimum: 1
      additionalProperties: false
    ImportExportSchedulerCapacity:
      type: object
      required:
      - mode
      - max_active_jobs
      - memory_budget_mib
      - io_budget_mib
      - cpu_units
      properties:
        mode:
          type: string
          enum:
          - dynamic
          - manual
        max_active_jobs:
          type: integer
          minimum: 1
        memory_budget_mib:
          type: integer
          format: int64
          minimum: 1
        io_budget_mib:
          type: integer
          format: int64
          minimum: 1
        cpu_units:
          type: integer
          minimum: 1
      additionalProperties: false
    ImportExportSchedulerRecommendation:
      type: object
      required:
      - scheduler
      - estimate
      - recommended_active_jobs
      - admitted_jobs
      - max_queued_jobs
      - max_queued_jobs_per_instance
      properties:
        scheduler:
          $ref: '#/components/schemas/ImportExportSchedulerSnapshot'
        estimate:
          $ref: '#/components/schemas/ImportExportJobResourceCost'
        recommended_active_jobs:
          type: integer
          description: Mode-independent resource-model concurrency for jobs with the requested characteristics, bounded by dynamic_max_active_jobs. Zero is a valid safety result when the live memory budget cannot fit one modelled job; clients must not clamp it to one. CPU and I/O are concurrency weights, so a memory-safe job that exceeds either whole weight budget is recommended as one isolated job. In manual mode, compare it with scheduler.capacity.max_active_jobs, which is the actual fixed ceiling.
          minimum: 0
        admitted_jobs:
          type: integer
          description: Current node-wide durable jobs and synchronous data operations holding queue admission, including work still waiting for an instance lock.
          minimum: 0
        max_queued_jobs:
          type: integer
          minimum: 1
        max_queued_jobs_per_instance:
          type: integer
          minimum: 1
      additionalProperties: false
    ImportExportSchedulerSnapshot:
      type: object
      required:
      - capacity
      - active_jobs
      - waiting_jobs
      - active_memory_mib
      - active_io_mib
      - active_cpu_units
      - accepting
      properties:
        capacity:
          $ref: '#/components/schemas/ImportExportSchedulerCapacity'
        active_jobs:
          type: integer
          minimum: 0
        waiting_jobs:
          type: integer
          minimum: 0
        active_memory_mib:
          type: integer
          format: int64
          minimum: 0
        active_io_mib:
          type: integer
          format: int64
          minimum: 0
        active_cpu_units:
          type: integer
          minimum: 0
        accepting:
          type: boolean
      additionalProperties: false
    Protocol:
      type: string
      enum:
      - postgres
      - redis
      - valkey
      - mariadb
      - mysql
      - mongodb
      - clickhouse
      - qdrant
    SystemResponse:
      type: object
      required:
      - service
      - version
      - api_version
      - api_readiness
      - uuid
      - token_id
      - remote
      - api_host
      - api_port
      - api_bind
      - api_ssl_enabled
      - api_rate_limit_per_minute
      - api_rate_limit_scope
      - daemon_engine
      - daemon_socket
      - database_container_network_mode
      - database_backend_transport
      - daemon_disk_limits_enforced
      - disk_mode
      - prevent_cpu_overallocation
      - prevent_memory_overallocation
      - prevent_disk_overallocation
      - remote_import_enabled
      - postgres_enabled
      - redis_enabled
      - valkey_enabled
      - mariadb_enabled
      - mysql_enabled
      - mongodb_enabled
      - clickhouse_enabled
      - clickhouse_http_enabled
      - clickhouse_http_bind
      - clickhouse_http_port
      - qdrant_enabled
      - deployment_capabilities
      - gateways
      properties:
        service:
          type: string
          enum:
          - databases-everywhere
        version:
          type: string
        api_version:
          type: string
          example: 0.17.0
        api_readiness:
          type: string
          enum:
          - ready
        uuid:
          type: string
        token_id:
          type: string
        remote:
          type: string
          description: Panel URL; empty on a standalone node
        api_host:
          type: string
        api_port:
          type: integer
          format: int32
          minimum: 0
        api_bind:
          type: string
        api_ssl_enabled:
          type: boolean
        api_rate_limit_per_minute:
          type: integer
          format: int32
          description: Fixed-window request allowance for each authenticated credential and transport-peer IP.
          minimum: 1
        api_rate_limit_scope:
          type: string
          enum:
          - credential_and_peer_ip
        daemon_engine:
          type: string
          enum:
          - docker
          - podman
        daemon_socket:
          type: string
        database_container_network_mode:
          type: string
          enum:
          - none
        database_backend_transport:
          type: string
          enum:
          - unix_socket
        daemon_disk_limits_enforced:
          type: boolean
        disk_mode:
          type: string
        prevent_cpu_overallocation:
          type: boolean
          description: Whether create and limit-increase admission prevents configured CPU reservations from exceeding detected host cores.
        prevent_memory_overallocation:
          type: boolean
          description: Whether create and limit-increase admission enforces the configured memory pool and reserve.
        prevent_disk_overallocation:
          type: boolean
          description: Whether create and limit-increase admission enforces the configured disk pool and reserve.
        remote_import_enabled:
          type: boolean
          description: Whether this node accepts credential-based remote import sources.
        postgres_enabled:
          type: boolean
        redis_enabled:
          type: boolean
        valkey_enabled:
          type: boolean
        mariadb_enabled:
          type: boolean
        mysql_enabled:
          type: boolean
        mongodb_enabled:
          type: boolean
        clickhouse_enabled:
          type: boolean
        clickhouse_http_enabled:
          type: boolean
        clickhouse_http_bind:
          type: string
        clickhouse_http_port:
          type: integer
          format: int32
          minimum: 0
        qdrant_enabled:
          type: boolean
        deployment_capabilities:
          type: array
          items:
            $ref: '#/components/schemas/DeploymentCapability'
          description: Per-protocol deployment modes understood by this daemon. Panels choose the mode on create; DBEV validates and provisions it.
        gateways:
          $ref: '#/components/schemas/GatewayReadiness'
      additionalProperties: false
    WsTokenRequest:
      type: object
      description: Use either instance targets with instance scopes, or pools plus server_id with pool scopes. Mixing target types or scopes is rejected. The panel must authorize access to every database in a pool before granting pool logs or metrics.
      required:
      - subject
      - scopes
      properties:
        pools:
          type: array
          items:
            type: string
          description: Explicit pool IDs, bound to their current owner and generation. No all-pools grant exists.
          maxItems: 256
        server_id:
          type:
          - string
          - 'null'
          description: Required for pool targets; derived from the authorized game-server record.
        subject:
          type: string
        scopes:
          type: array
          items:
            type: string
            enum:
            - monitor:read
            - logs:read
            - import-export:read
            - pools:monitor
            - pools:logs
        instances:
          type: array
          items:
            type: string
          description: Explicit instance allow-list. Each ID is bound inside the opaque JWT to the current immutable instance generation, so deletion/recreation never transfers access to a replacement. While an instance's creation (accepted with 202) has not stored it yet, its ID binds to that creation attempt instead; such a token streams the attempt's install_progress (through completed or failed) and, for dedicated creations, its container logs, but never the stored instance. Mint a new token once the instance exists. Unknown IDs return 404. Must be non-empty unless all_instances is true.
          maxItems: 256
        all_instances:
          type: boolean
          description: Explicitly grants node-wide instance access and cannot be combined with a non-empty instances list.
        ttl_seconds:
          type:
          - integer
          - 'null'
          format: int64
          default: 900
          maximum: 3600
          minimum: 1
      additionalProperties: false
    WsTokenResponse:
      type: object
      required:
      - token_type
      - token
      - expires_at_unix
      properties:
        token_type:
          type: string
          enum:
          - Bearer
        token:
          type: string
        expires_at_unix:
          type: integer
          format: int64
      additionalProperties: false
  responses:
    ApiError:
      description: Request rejection or server-side failure. Internal details are logged under error_id and are never returned to clients.
      headers:
        X-Error-Id:
          schema:
            type: string
            format: uuid
          description: Opaque support identifier included for server-side failures.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing, invalid, or insufficient bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: panel token
security:
- bearerAuth: []
tags:
- name: system
  description: Daemon status, configuration and metrics.
- name: instances
  description: Database instance lifecycle.
- name: import-export
  description: Imports, exports and their jobs.
- name: backups
  description: Instance backups and restores.
- name: artifacts
  description: Stored export artifacts and downloads.
- name: pools
  description: Shared engine pools.
- name: monitoring
  description: Resources, activity and live streams.
- name: admin
  description: Node-wide administration.

          pattern: ^upl_[0-9a-f]{32}$
        source_database:
          type: string
          example: legacy_tenant
          maxLength: 63
          minLength: 1
      additionalProperties: false
    WsTokenRequest:
      type: object
      description: Use either instances with instance scopes, or pools plus server_id with pool scopes.
      required:
      - subject
      - scopes
      properties:
        pools:
          type: array
          items:
            type: string
          maxItems: 256
        server_id:
          type:
          - string
          - 'null'
        subject:
          type: string
        scopes:
          type: array
          items:
            type: string
            enum:
            - monitor:read
            - logs:read
            - import-export:read
            - pools:monitor
            - pools:logs
        instances:
          type: array
          items:
            type: string
          maxItems: 256
        all_instances:
          type: boolean
        ttl_seconds:
          type:
          - integer
          - 'null'
          format: int64
          default: 900
          maximum: 3600
          minimum: 1
      additionalProperties: false
    WsTokenResponse:
      type: object
      required:
      - token_type
      - token
      - expires_at_unix
      properties:
        token_type:
          type: string
          enum:
          - Bearer
        token:
          type: string
        expires_at_unix:
          type: integer
          format: int64
      additionalProperties: false
  responses:
    ApiError:
      description: Request rejection or server-side failure. Internal details are logged under error_id and are never returned to clients.
      headers:
        X-Error-Id:
          schema:
            type: string
            format: uuid
          description: Opaque support identifier included for server-side failures.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing, invalid, or insufficient bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: panel token
security:
- bearerAuth: []
tags:
- name: system
  description: Daemon status, configuration and metrics.
- name: instances
  description: Database instance lifecycle.
- name: import-export
  description: Imports, exports and their jobs.
- name: backups
  description: Instance backups and restores.
- name: artifacts
  description: Stored export artifacts and downloads.
- name: pools
  description: Shared engine pools.
- name: monitoring
  description: Resources, activity and live streams.
- name: admin
  description: Node-wide administration.
